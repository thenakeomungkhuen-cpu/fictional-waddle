<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>บันทึกทวีปโต้วหลัว</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sarabun:wght@400;500;700&display=swap">
<style>

/* System UI: one committed dark look (holographic status windows). Wide = 3 columns, narrow = one panel at a time with a bottom tab bar. */
:root {
  --bg: #040a13; --bg2: #071220; --panel: rgba(9, 24, 44, .86); --panel2: rgba(14, 36, 64, .9);
  --line: #1b4a73; --line2: #2f7fb5; --cy: #56dcff; --cy2: #2a8fc0; --fg: #dcf3ff; --mut: #86a9c4;
  --hp: #ff5f72; --sp: #56dcff; --gold: #ffd166; --grn: #57e8a8; --red: #ff5a4f; --pur: #b58aff; --warn: #ffb347;
  --f-ui: 'Chakra Petch', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
  --f-body: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(40, 120, 190, .22), transparent 60%),
    repeating-linear-gradient(0deg, rgba(86, 220, 255, .035) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(86, 220, 255, .035) 0 1px, transparent 1px 34px),
    var(--bg);
  padding-block: 10px 84px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.mut { color: var(--mut); }
.sm { font-size: 12.5px; line-height: 1.45; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { max-width: 1500px; margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  border: 1px solid var(--line); background: var(--panel); padding: 8px 12px; position: relative; }
.brand { font-family: var(--f-ui); font-weight: 700; letter-spacing: .06em; color: var(--cy); text-shadow: 0 0 12px rgba(86, 220, 255, .6); margin-right: auto; display: flex; gap: 8px; align-items: center; min-width: 0; }
.brand svg { width: 22px; height: 22px; flex: none; }
.pill { font-family: var(--f-ui); font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line); background: var(--bg2); white-space: nowrap; }
.pill b { color: var(--cy); font-weight: 600; }
.pill.gold b { color: var(--gold); } .pill.red b { color: var(--red); }
.demo { max-width: 1500px; margin: 0 auto 10px; border: 1px dashed var(--warn); color: var(--warn); padding: 6px 12px; font-size: 13px; background: rgba(255, 179, 71, .06); }

/* ---------- layout ---------- */
.grid { max-width: 1500px; margin: 0 auto; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.rcol { display: contents; }
@media (min-width: 1100px) {
  body { padding-bottom: 16px; }
  .grid { grid-template-columns: minmax(300px, 340px) minmax(0, 1fr) minmax(300px, 350px); align-items: start; }
  .rcol { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .side, .rcol { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-right: 2px; }
  .tabbar { display: none !important; }
  .col[data-p] { display: grid !important; }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .col.mid { grid-column: 1 / -1; order: -1; }
  .col[data-p] { display: grid !important; }
  .tabbar { display: none !important; }
  body { padding-bottom: 16px; }
}

/* ---------- window ---------- */
.win { position: relative; border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel2), var(--panel)); box-shadow: 0 0 0 1px rgba(86, 220, 255, .05), 0 0 22px rgba(20, 110, 180, .16) inset; min-width: 0; }
.win::before, .win::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cy); pointer-events: none; filter: drop-shadow(0 0 4px rgba(86, 220, 255, .8)); }
.win::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.win::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.wh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(86, 220, 255, .16), transparent 70%); font-family: var(--f-ui); }
.wh h2 { font-size: 14px; font-weight: 600; letter-spacing: .04em; color: var(--cy); }
.wh .code { margin-left: auto; font-size: 11px; color: var(--mut); letter-spacing: .1em; }
.wb { padding: 10px; display: grid; gap: 10px; }
.sub { font-family: var(--f-ui); font-size: 11.5px; letter-spacing: .12em; color: var(--cy2); border-bottom: 1px dashed var(--line); padding-bottom: 2px; }

/* identity */
.idn { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: center; }
.avatar { width: 58px; height: 58px; border: 1px solid var(--line2); background: radial-gradient(circle at 50% 35%, rgba(86, 220, 255, .35), transparent 65%), var(--bg2); display: grid; place-items: center; }
.avatar svg { width: 40px; height: 40px; }
.idn .nm { font-family: var(--f-ui); font-size: 18px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.rank { color: var(--gold); font-family: var(--f-ui); font-size: 13px; }

/* bars */
.bar { display: grid; gap: 2px; }
.bar .l { display: flex; justify-content: space-between; font-family: var(--f-ui); font-size: 12px; }
.tr { height: 10px; background: var(--bg2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.tr i { display: block; height: 100%; background: repeating-linear-gradient(90deg, currentColor 0 6px, transparent 6px 8px); box-shadow: 0 0 10px currentColor; }
.tr.thin { height: 6px; }
.c-hp { color: var(--hp); } .c-sp { color: var(--sp); } .c-gold { color: var(--gold); } .c-grn { color: var(--grn); } .c-pur { color: var(--pur); } .c-red { color: var(--red); } .c-warn { color: var(--warn); }

/* attribute grid */
.attrs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.at { border: 1px solid var(--line); background: var(--bg2); padding: 4px 4px 5px; text-align: center; position: relative; min-width: 0; }
.at b { display: block; font-family: var(--f-ui); font-size: 19px; line-height: 1.15; color: var(--fg); }
.at span { display: block; font-family: var(--f-ui); font-size: 11px; color: var(--cy2); letter-spacing: .08em; }
.at small { display: block; font-size: 10.5px; color: var(--mut); line-height: 1.2; }
.at.up b { color: var(--grn); text-shadow: 0 0 8px rgba(87, 232, 168, .6); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 8px; font-family: var(--f-ui); font-size: 12.5px; }
.kv div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); gap: 6px; }
.kv span { color: var(--mut); }
.exp { display: grid; gap: 6px; }
.exp .row { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font-family: var(--f-ui); font-size: 12px; }
.rings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ring { width: 30px; height: 30px; border-radius: 50%; border: 4px solid; box-shadow: 0 0 10px currentColor, inset 0 0 6px currentColor; display: grid; place-items: center; font-family: var(--f-ui); font-size: 11px; color: inherit; }
.ring.empty { border: 1px dashed var(--line2); box-shadow: none; color: var(--mut); }
.r-y { color: #f6cf4a; } .r-p { color: #b47cff; } .r-b { color: #7c8aa5; } .r-r { color: #ff5247; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); background: var(--bg2); }
.tag.bad { border-color: #8a3a2f; color: #ffc4b8; } .tag.good { border-color: #23755a; color: #a8f3d2; }

/* scene + story */
.scene { position: relative; height: 150px; overflow: hidden; border-bottom: 1px solid var(--line); }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .cap { position: absolute; left: 10px; bottom: 8px; right: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-end; font-family: var(--f-ui); text-shadow: 0 1px 6px #000; }
.scene .cap b { font-size: 17px; overflow-wrap: anywhere; }
.story { padding: 12px; display: grid; gap: 12px; }
.msg { border-left: 2px solid var(--cy2); padding: 2px 0 2px 12px; font-size: 16px; line-height: 1.8; }
.msg .who { font-family: var(--f-ui); font-size: 11px; letter-spacing: .14em; color: var(--cy2); }
.msg p + p { margin-top: .7em; }
.me { justify-self: end; max-width: 88%; border: 1px solid var(--line2); background: rgba(47, 127, 181, .18); padding: 6px 12px; }
.note { border: 1px solid var(--line2); background: rgba(86, 220, 255, .07); padding: 8px 10px; display: grid; gap: 4px; font-family: var(--f-ui); font-size: 13px; }
.note .t { color: var(--cy); letter-spacing: .08em; font-size: 12px; }
.note.gold { border-color: #7a6223; background: rgba(255, 209, 102, .07); } .note.gold .t { color: var(--gold); }
.roll { border: 1px solid var(--line2); background: var(--bg2); padding: 8px 10px; display: grid; gap: 4px; font-family: var(--f-ui); font-size: 13px; }
.roll .big { font-size: 26px; font-weight: 700; line-height: 1.1; }
.roll .ok { color: var(--grn); } .roll .no { color: var(--hp); }
.roll .f { color: var(--mut); font-size: 12.5px; overflow-wrap: anywhere; }

/* combat */
.foe { display: grid; gap: 8px; }
.foe .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.foe .hd b { font-family: var(--f-ui); font-size: 16px; }
.order { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--f-ui); font-size: 12px; }
.order span { border: 1px solid var(--line); padding: 2px 8px; background: var(--bg2); }
.order span.on { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 8px rgba(255, 209, 102, .4); }
table.st { width: 100%; border-collapse: collapse; font-family: var(--f-ui); font-size: 12.5px; }
table.st th, table.st td { border: 1px solid var(--line); padding: 3px 4px; text-align: center; }
table.st th { color: var(--cy2); font-weight: 500; background: var(--bg2); }
table.st td small { color: var(--mut); display: block; font-size: 10.5px; }
.scroll { overflow-x: auto; }

/* composer */
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.act { text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--bg2); min-height: 44px; font-size: 14px; }
.act:hover { border-color: var(--cy); box-shadow: 0 0 10px rgba(86, 220, 255, .3); }
.inp { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.inp textarea { font: inherit; color: var(--fg); background: var(--bg2); border: 1px solid var(--line2); padding: 8px 10px; min-height: 48px; resize: vertical; width: 100%; }
.go { border: 1px solid var(--cy); background: rgba(86, 220, 255, .16); color: var(--cy); font-family: var(--f-ui); font-weight: 600; padding: 0 16px; min-height: 48px; text-shadow: 0 0 8px rgba(86, 220, 255, .7); }
.go:hover { background: rgba(86, 220, 255, .3); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.qb { border: 1px solid var(--line); background: var(--bg2); padding: 6px 10px; font-family: var(--f-ui); font-size: 12.5px; min-height: 36px; }
.qb:hover { border-color: var(--cy); }
.qb.gold { border-color: #7a6223; color: var(--gold); }

/* right column bits */
.q { display: grid; gap: 2px; border-left: 2px solid var(--gold); padding-left: 8px; }
.q b { font-size: 14px; } .q.side { border-color: var(--cy2); }
.npc { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.npc b { font-size: 14px; overflow-wrap: anywhere; }
.meter { grid-column: 1 / -1; height: 6px; background: linear-gradient(90deg, #7a2f2f, var(--bg2) 50%, #1f6b52); border: 1px solid var(--line); position: relative; }
.meter i { position: absolute; top: -3px; width: 3px; height: 10px; background: var(--fg); transform: translateX(-50%); box-shadow: 0 0 6px #fff; }
.duo { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.sig { width: 44px; height: 44px; }
.stage { display: flex; gap: 3px; }
.stage i { flex: 1; height: 14px; border: 1px solid var(--line); background: var(--bg2); }
.stage i.on { background: var(--grn); box-shadow: 0 0 8px var(--grn); border-color: var(--grn); }
.shop { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
.shop .pts { font-family: var(--f-ui); font-size: 24px; font-weight: 700; color: var(--gold); text-shadow: 0 0 10px rgba(255, 209, 102, .5); }
.sfs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.sf { border: 1px solid var(--line); background: var(--bg2); padding: 5px 2px; text-align: center; font-family: var(--f-ui); font-size: 10.5px; line-height: 1.25; min-height: 42px; }
.sf b { display: block; color: var(--cy); font-size: 12px; }
.sf:hover { border-color: var(--cy); }
.log { display: grid; gap: 4px; font-family: var(--f-ui); font-size: 12px; }
.log div { display: grid; grid-template-columns: 52px 1fr; gap: 6px; border-bottom: 1px dotted var(--line); padding-bottom: 2px; }
.log span { color: var(--mut); }

/* mobile tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(4, 10, 19, .96); border-top: 1px solid var(--line2);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tb { background: none; border: 0; padding: 8px 2px 9px; font-family: var(--f-ui); font-size: 12px; color: var(--mut); display: grid; gap: 2px; justify-items: center; min-height: 56px; border-top: 2px solid transparent; }
.tb svg { width: 20px; height: 20px; }
.tb[aria-selected="true"] { color: var(--cy); border-top-color: var(--cy); text-shadow: 0 0 8px rgba(86, 220, 255, .7); }
@media (max-width: 699px) {
  .col[data-p] { display: none; }
  .col[data-p].show { display: grid; }
  .hudm { display: grid !important; }
  .scene { height: 120px; }
  .acts { grid-template-columns: 1fr; }
}
.hudm { display: none; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) {
  .win { animation: on .5s ease-out both; }
  @keyframes on { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pu 1.8s ease-in-out infinite; }
  @keyframes pu { 50% { opacity: .55; } }
}

/* ---- game additions ---- */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lg { font-family: var(--f-ui); font-size: 12px; color: var(--cy2); letter-spacing: .06em; }
.field input[type=text], .field select, .field textarea { font: inherit; color: var(--fg); background: var(--bg2); border: 1px solid var(--line2); padding: 8px 10px; min-height: 44px; width: 100%; min-width: 0; }
.opts { display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg2); padding: 8px 10px; display: grid; gap: 2px; min-height: 44px; }
.opt b { font-family: var(--f-ui); }
.opt[aria-pressed="true"] { border-color: var(--cy); box-shadow: 0 0 10px rgba(86, 220, 255, .35); background: rgba(86, 220, 255, .12); }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.check input { width: 22px; height: 22px; margin-top: 2px; }
.create { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
.err { border: 1px solid #8a3a2f; background: rgba(255, 95, 114, .08); color: #ffc4b8; padding: 8px 10px; overflow-wrap: anywhere; }
.warnb { border: 1px solid #7a6223; background: rgba(255, 209, 102, .07); color: var(--gold); padding: 8px 10px; overflow-wrap: anywhere; font-size: 13.5px; }
.plus { border: 1px solid var(--grn); color: var(--grn); background: rgba(87, 232, 168, .1); font-family: var(--f-ui); font-size: 12px; padding: 0 6px; min-height: 26px; margin-top: 3px; width: 100%; }
.plus:hover { background: rgba(87, 232, 168, .25); }
.go:disabled, .qb:disabled, .act:disabled { opacity: .45; cursor: not-allowed; }
.think { color: var(--mut); font-family: var(--f-ui); }
.d100 { font-family: var(--f-ui); font-size: 34px; font-weight: 700; text-align: center; color: var(--cy); text-shadow: 0 0 12px rgba(86, 220, 255, .7); min-height: 44px; }
.msg, .me, .roll .f, .note div, .q, .tag { overflow-wrap: anywhere; }
.sysn { justify-self: center; font-family: var(--f-ui); font-size: 12px; color: var(--mut); }
.gen td, .gen th { font-size: 12px; }
.prop { border: 1px solid #7a6223; padding: 8px; display: grid; gap: 6px; background: rgba(255, 209, 102, .05); }
.row2 { display: flex; gap: 6px; flex-wrap: wrap; }
.row2 > * { flex: 1 1 120px; }
.danger { border-color: #8a3a2f !important; color: #ffb0a3 !important; }
.list { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; }
.avatar { padding: 0; overflow: hidden; cursor: pointer; }
.avatar img, .sigb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sigb { width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); background: var(--bg2); overflow: hidden; display: grid; place-items: center; }
.sigb:hover, .avatar:hover { border-color: var(--cy); }
.th { width: 46px; height: 46px; object-fit: cover; border: 1px solid var(--line2); flex: none; }
.th.s { width: 28px; height: 28px; }
.scimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(4, 10, 19, .85)); pointer-events: none; }
.scene .cap { z-index: 1; }
.cats { display: flex; flex-wrap: wrap; gap: 5px; }
.cat { border: 1px solid var(--line); background: var(--bg2); padding: 5px 9px; font-family: var(--f-ui); font-size: 12.5px; min-height: 34px; }
.cat[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.it { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; border-bottom: 1px dotted var(--line); padding: 6px 0; }
.it b { font-size: 14px; overflow-wrap: anywhere; }
.it .pr { font-family: var(--f-ui); color: var(--gold); white-space: nowrap; text-align: right; }
.it .nt { grid-column: 1 / -1; font-size: 12.5px; color: var(--mut); overflow-wrap: anywhere; }
.it .qb { grid-column: 1 / -1; }
.gal { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.avatar, label.sigb, label.qb { cursor: pointer; position: relative; }
label.qb { display: inline-grid; place-items: center; }
label.avatar:focus-within, label.sigb:focus-within, label.qb:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
.avatar img { object-position: 50% 18%; }
.scene.big { height: 320px; }
.scene.big .scimg { object-position: 50% 24%; }
.artb { position: absolute; inset: 0; padding: 0; border: 0; background: none; cursor: zoom-in; }
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .92); display: grid; place-items: center; padding: 12px; cursor: zoom-out; border: 0; width: 100%; }
.zoom img { max-width: 100%; max-height: calc(100vh - 24px); object-fit: contain; }
.arts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.arts button { padding: 0; border: 1px solid var(--line); background: var(--bg2); display: grid; gap: 2px; font-family: var(--f-ui); font-size: 10.5px; color: var(--mut); }
.arts img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
@media (max-width: 699px) { .scene.big { height: 250px; } }
#dock { position: sticky; bottom: 8px; z-index: 15; animation: none; background: linear-gradient(180deg, #0f2744, #081626); box-shadow: 0 -10px 26px rgba(0, 0, 0, .6); }

<script type="application/json" id="rulesdata">{"core": [{"name": "Douluo_Another_Fate_Master_Rulebook_Consolidated_v0.4", "text": "# Douluo Dalu: Another Fate — Master Rulebook\n## Nightmare Edition | Consolidated Working Release v0.4\n\n**Status:** CONSOLIDATED REFERENCE — updated 2026-11-15 to match Authoritative Rule Register v0.3; not a replacement for source documents  \n**Supersedes:** Master Rulebook v0.3 (preserved unchanged), v0.2, v0.1  \n**Project state:** Rules consolidation and audit; actual game and character creation have not started  \n**Format:** E2 — Master Rulebook + Appendices  \n**Rule authority:** Existing LOCKED source documents remain authoritative within their scopes.\n\n> This document is an index and integrated reference. If a summary here conflicts with a source document, the source document wins. This consolidation does not silently amend any LOCKED rule.\n\n## 1. Core Operating Principles\n\n- Lethality: every risky action can have severe consequences, including death; Full Death invokes Full Reset. This applies in every difficulty mode.\n- Difficulty mode (Easy / Normal / Hard / Nightmare) is chosen by the player at the start of each Run and sets non-player attribute multipliers and extra-action chances (Difficulty Mode Framework v1.0).\n- Natural D100 results: 01–05 always fail and 96–100 always succeed on attack hit, resistance, and general checks (D100 Natural Result Rule v1.0).\n- One in-world day is 24 hours. Every 30 days, a special event is rolled with a 50/50 good/bad outcome.\n- Risky or uncertain actions use D100 (01–100). Show the roll, DC, modifiers, formula, and outcome.\n- Certain actions do not require a roll. Impossible actions cannot be forced to succeed by rolling.\n- Combat uses D100 for checks and D&D dice for damage.\n- NPCs have independent goals and may lie, betray, fight, or kill the player.\n- NPCs and gods are not omniscient; they need a plausible information channel.\n- The player knows Douluo Dalu canon parts 1–5; NPCs do not automatically know future events or inaccessible information.\n- Canon history is the starting point and can change through player actions.\n- DM Wishes: 3 per Run; Full Reset restores the count to 3.\n- The Game Master Ledger is the authoritative record of state, time/location, events, NPC relations, rolls, quests/rewards, plot changes, Wishes, and rule versions.\n\n## 2. Rule Precedence\n\n1. Approved Core Rules.\n2. Approved category-specific rules.\n3. Galakrond / Ddraig special rules within their documented scopes; they do not overwrite Core Rules.\n4. Adapted D&D rules.\n5. DM ruling for matters not specified by higher authority.\n\nThe DM may propose amendments but cannot change a LOCKED rule without explicit player approval and a separately versioned revision.\n\n## 3. Official Category Index — Original Numbering\n\nThere are 30 active LOCKED categories across original slots 01–31. Category 17 was cancelled and is skipped; it is not an active category.\n\n| No. | Category | Status |\n|---:|---|---|\n| 01 | Core Rules | LOCKED |\n| 02 | Character System | LOCKED |\n| 03 | Soul Power System | LOCKED |\n| 04 | Martial Soul System | LOCKED |\n| 05 | Soul Ring System | LOCKED |\n| 06 | Soul Bone System | LOCKED |\n| 07 | Equipment System | LOCKED |\n| 08 | Inventory & Storage System | LOCKED |\n| 09 | Combat System | LOCKED; supplemented by Combat Formula v1.0 |\n| 10 | Status Effects & Conditions | LOCKED; supplemented by Status/Death v1.0 |\n| 11 | Skill & Ability System | LOCKED; supplemented by Skill Proficiency v1.0 |\n| 12 | Quest & Mission System | LOCKED |\n| 13 | NPC & Relationship System | LOCKED |\n| 14 | World & Exploration System | LOCKED |\n| 15 | Faction & Organization System | LOCKED |\n| 16 | Economy & Trading System | LOCKED |\n| 17 | Crafting & Production System | CANCELLED / SKIPPED |\n| 18 | Information & Knowledge System | LOCKED |\n| 19 | Event & World Simulation System | LOCKED |\n| 20 | Death, Resurrection & Rebirth System | LOCKED; supplemented by Death/Full Reset v1.0 |\n| 21 | Divine System | LOCKED |\n| 22 | Reputation & Karma System | LOCKED |\n| 23 | Law, Crime & Justice System | LOCKED |\n| 24 | Dialogue & Social Interaction System | LOCKED |\n| 25 | Achievement & Milestone System | LOCKED |\n| 26 | Survival & Environmental System | LOCKED |\n| 27 | Travel & Transportation System | LOCKED |\n| 28 | Time & Calendar System | LOCKED |\n| 29 | Privacy, Information Access & Surveillance System | LOCKED |\n| 30 | Game Interface & System Notification | LOCKED |\n| 31 | Special Rules & Exceptions System | LOCKED |\n\nThe names and numbering above follow Rulebook Audit v1 and the original v0.1 category index. Do not substitute the renumbered categories in Working Consolidation v0.2.\n\n## 4. Confirmed Supplement Register\n\n| Source document | Version / status | Scope |\n|---|---|---|\n| Random Starting Attribute Generation | v1.0 LOCKED | Initial attributes and starting current HP/SP |\n| Human Soul Rank Framework | v1.1 LOCKED | H1–H10 and Divine progression distinctions |\n| H-16 Attribute & Combat Rank | v1.1 LOCKED | Eight attributes, effective attribute order, Rank Baseline, archetypes, OCI |\n| Character & Entity Classification | v1.1 LOCKED | Entity identity, rank namespaces, threat and combat-rank distinctions |\n| Soul Beast Rank Framework | v1.1 LOCKED | SB1–SB7, DS-Rank, bloodline rank/purity, IQ rank |\n| Soul Beast Rank Baseline Equivalence | v1.0 LOCKED | Soul Beast age → H-16 Rank Baseline row for attribute generation |\n| Human Transformation Framework | v1.1 LOCKED | Nonhuman-to-human transformation |\n| Non-Soul Human Classification | v1.1 LOCKED | Civilian, social, professional, military, command tracks |\n| Combat Formula Framework | v1.0 LOCKED | Derived stats, checks, damage, defense, initiative |\n| D100 Natural Result Rule | v1.0 LOCKED | 01–05 fail / 96–100 succeed |\n| Difficulty Mode Framework | v1.0 LOCKED | Easy / Normal / Hard / Nightmare |\n| Basic Unarmed Punch Damage Rule | v1.0 approved | Ordinary punch = Current STR × 0.5 raw physical |\n| HP/SP Starting Base Addendum | v1.0 LOCKED | Player character Max HP/SP base terms |\n| HP/SP Growth Bonus | v1.0 LOCKED | HPGB / SPGB formulas |\n| EXP Requirement Framework | v1.1 LOCKED | Four EXP pools, per-level requirement, gates, overflow |\n| Phase 1 Consolidated Rules | v1.0 LOCKED | Skill Capacity, Combat/Knowledge EXP, 2-hour cultivation, inventory capacity, combat skill framework |\n| Soul Ring & Absorption Rules | v1.1 LOCKED | Ring absorption; 2 skills at 100,000+ years |\n| Soul Ring Skill SP Cost and Cooldown Rule | v1.0 approved | SP cost = 2 × ring number + 3; cooldown by ring age |\n| Soul Bone Fusion Rules | v1.0 LOCKED | Fusion eligibility, checks, duration, failure, removal, ledger |\n| Soul Ring & Soul Bone Level Progression Bonus | v1.1 LOCKED | Level progression bonuses |\n| Permanent Attribute Acquisition | v1.1 LOCKED | Permanent bonuses and distribution |\n| Herb and Plant Permanent Benefit Framework | v1.0 LOCKED | Permanent benefits from herbs and plants |\n| Recovery / Abnormal Status / Death / Skill Proficiency | v1.0 LOCKED | Recovery, status, rescue, Full Death, proficiency |\n| Unique System Framework | v2.1 LOCKED | System functions, Shop Pts, Shop, random supply, Custom Order, Domains, Full Reset persistence |\n| Galakrond Rules | v2.1 LOCKED + v2.2 LOCKED | Martial Soul 1; v2.2 governs the clauses it resolves |\n| Galakrond Martial Soul Possession Temporary Attribute Rules | v1.0 approved | Possession bonuses and temporary Dragon Devour growth |\n| Ddraig Boosted Gear Rules | v2.1 LOCKED | Martial Soul 2 / Sacred Gear |\n| Shrek Seven Devils Anti-Protagonist Personality Framework | v1.0 LOCKED | NPC personality for the protagonist group |\n| Opponent Full Disclosure Policy | v1.0 LOCKED | Opponent status sheet before combat |\n| Character Attribute/Skill Auto-Record Policy | v1.0 approved | Immediate recording of attribute and skill changes |\n| Harmonization Addendum | v1.0 LOCKED | How to read conflicting clauses (MP = SP, non-player HP/SP, training table, Boost order) |\n| Operational Appendices | v1.0 | Character Window, Master Ledger, desk audit |\n\nReference data (not rules): Important Characters and Opponents Database v1.0 DRAFT; campaign event records dated 2026-11-14.\n\n## 5. Progression and Attribute Reference\n\n### 5.1 Four independent EXP pools\n\nTraining EXP, Soul Power EXP, Combat EXP, and Knowledge EXP are separate pools. Do not merge, exchange, or treat them as automatic Skill Proficiency.\n\nEXP requirement for current Level L:\n\n`EXP(L) = 100 + 20 × (L − 1) + 100 × floor((L − 1) / 10)`\n\nSoul Power has a Soul Ring breakthrough gate at each 10-level boundary. The next ring, successful absorption, and sufficient EXP are distinct requirements. Overflow is retained when a gate blocks progression. Soul Power Level +1 grants 2 Attribute Points. Training / Combat / Knowledge Level are progression measures and are not Human Soul Rank, Combat Rank, Professional Rank, or Skill Proficiency.\n\n### 5.2 Human Soul Rank\n\nH1 Level 1–10; H2 11–20; H3 21–30; H4 31–40; H5 41–50; H6 51–60; H7 61–70; H8 71–80; H9 81–90; H10 91–100. The upper endpoint of H1–H9 is a gate and does not automatically promote the character. H10 sub-ranks: Standard 91–94; Super 95–98; Limit 99; Level 100 remains H10 without an assigned sub-rank. There is no Level 101 under the current framework.\n\nHuman Divine Progression is separate: D0 Candidate, D1 Quasi-God, D2 True God. Level 100 alone does not grant D0 without a genuine path toward Godhood.\n\n### 5.3 Attributes\n\nSTR, AGI, VIT, END, INT, WIS, PER, WILL. Effective Attribute:\n\n`(Base Attribute + Permanent Bonus) × Temporary Multiplier + Temporary Flat Bonus`\n\nStandard attribute range is 1–100. Values above 100 require a documented source/formula and do not remove source-specific caps.\n\n## 6. Combat and Survival Reference\n\nCombat uses D100 checks and D&D damage dice. The Combat Formula source governs derived values, hit/defense, damage reduction, critical hits, resistance, and initiative. HP ≤ 0 means Near Death, not automatic Full Death.\n\nPlayer character Max HP/SP use the HP/SP Starting Base Addendum and Growth Bonus. Increasing Max HP/SP does not automatically restore Current HP/SP.\n\nRecovery v1.0: 15 minutes restores 2% Max HP / 3% Max SP; 1 hour 8% / 12%; 8 hours 40% / 60%; 24 hours 100% / 100%. These are total rates for the selected continuous rest duration, not cumulative entries. Safe rest receives full rate; uninterrupted unsafe rest receives half rate; interruption ends the rest; unconsciousness is not natural rest. Recovery does not automatically heal injuries or remove statuses.\n\nDeath v1.0: General Near Death rescue window 10 minutes; Severe Injury 5 minutes; Critical Injury 3 minutes; Fatal Injury 1 minute. Rescue DCs are 60 / 80 / 100 / 120 respectively. Expiry requires an assessment of actual condition; HP 0 alone is not Full Death. Confirmed Full Death invokes Full Reset. The Unique System's specified System data (including Shop Pts) persists; character progression, attributes, Soul Rings/Bones, purchased Domains, equipment, money/assets, relationships, and current Run world state reset as specified by Unique System v2.1 and Core Death rules.\n\n## 7. Soul Ring and Soul Bone Reference\n\nSoul Ring absorption uses Soul Ring & Absorption v1.0. Soul Bone fusion uses Soul Bone Fusion v1.0. Do not replace their DCs, check counts, stage modifiers, durations, interruption rules, failure consequences, or reward conditions with estimates.\n\nSoul Bone Fusion v1.0 requires assessment of Body, Soul, Soul Power Capacity, Control, Position, Element, and Special Compatibility. It uses age-based Base DC, one overall Compatibility grade, Condition Modifier, and age-based check counts. A failed main check ends fusion immediately; no Partial Success. Failed fusion grants no permanent attribute or level bonus. The Soul Bone is not automatically destroyed. Controlled Removal only.\n\n## 8. Special Systems\n\n- Galakrond v2.1 with v2.2 governs Martial Soul 1. \"MP\" in these documents means SP (Harmonization Addendum H-07). G-10 remains unresolved; do not invent missing numerical values.\n- Ddraig v2.1 governs Boost stages, load, duration, overload, mastery, and special forms.\n- Unique System v2.1 governs the System, its Shop, and persistence across Full Reset; it is not omniscient. System-supplied Soul Rings and Soul Bones succeed automatically for the owner.\n- Special rules require a documented source, conditions, limits, and ledger entry. Any new exception requires approval.\n\n## 9. Character Interface and Ledger Architecture\n\nThe user selected B3 Hybrid Character Window and C3 Hybrid Game Master Ledger.\n\n### 9.1 Character Window — player-facing view\n\n**Overview panel**\n- Identity, aliases, species, age, origin, current location and in-world time.\n- Current / Highest Rank, applicable power-system ranks, Overall Combat Rank and Threat Level where assessed.\n- Current HP / Max HP; Current SP / Max SP; active critical condition and visible status/injury alerts.\n- Eight Primary Attributes and effective values.\n- Four EXP pools and their current Level tracks.\n- Martial Souls / Sacred Gear, equipped Soul Rings, standard and External Soul Bones.\n- Active skills, Proficiency, equipment, currency, and inventory summary.\n- Visible quests, achievements, relationships known to the character, and notifications.\n\n**Detail panels**\n1. Attributes & derived combat values.\n2. Soul Power & cultivation.\n3. Martial Souls, Soul Rings, Soul Bones and fusion history.\n4. Skills, abilities and Proficiency.\n5. Equipment, inventory and storage.\n6. Status, injuries, recovery and rescue timer.\n7. EXP, Level, ranks and milestones.\n8. Quests, achievements, relationships and known world information.\n9. Special Systems: Galakrond, Ddraig, Unique System, divine tracks.\n10. History and notifications.\n\nInformation must be filtered by what the character can know. Hidden NPC/world facts and DM-only rolls do not appear in the player-facing window unless revealed by an in-world information channel. This design operationalizes the existing category; it does not create new game statistics.\n\n### 9.2 Master Ledger — authoritative state\n\nMaintain one Master Ledger record with linked sub-ledgers:\n- Character State & Attribute History\n- Time / Calendar / Location / Travel\n- EXP / Level / Rank / Attribute Point History\n- Combat / D100 / DC / Modifiers / Damage / Outcome\n- Skill / Proficiency / STP / Evaluation\n- Soul Ring / Hunt / Absorption\n- Soul Bone / Fusion / Removal / Evolution\n- Permanent Attribute Source & Distribution\n- HP / SP / Recovery / Status / Injury / Death / Rescue\n- Equipment / Inventory / Currency / Assets\n- NPC / Relationship / Knowledge Access / Faction\n- Quest / Achievement / Reward\n- World Event / Timeline / Divine Intervention\n- Galakrond / Ddraig / Unique System\n- DM Wishes / Full Reset / Persistent System Data\n- Rule Version / Approval / Change History\n\nEvery consequential change must record: event ID, in-world timestamp, actor/source, before state, action/check, roll, DC, modifiers, formula, outcome, after state, source rule/version, and knowledge visibility. Unknown or unverified data must be marked; do not infer missing facts.\n\n### 9.3 Synchronization rules\n\n- Master Ledger is the source of truth; Character Window is a filtered view.\n- Sub-ledgers link to a stable character/entity ID and event ID.\n- Full Reset creates a new Run state and preserves only data explicitly designated persistent by the Unique System.\n- Historical data must not overwrite the new Run.\n- Record each roll once; display the same result in the relevant player-facing notification and audit history.\n- No silent correction of past records; corrections are appended with reason and reference.\n\n## 10. Nightmare Stress Test — Desk Audit\n\n**Test type:** rule-flow and arithmetic consistency review, not a live character combat simulation. No actual character, dice result, or in-game event is fabricated.\n\n| Test | Expected rule path | Audit result |\n|---|---|---|\n| Training and Soul Power EXP | Separate pools; requirement formula; ring gate blocks progression and retains overflow | PASS — no cross-pool conversion |\n| Soul Ring absorption | Age Base DC + Compatibility + Special modifier, clamp; age-based checks; failure stops process | PASS — procedure defined in source |\n| Soul Bone fusion | Seven compatibility dimensions; one overall grade; age DC/check count; failed main check terminates | PASS — no Partial Success |\n| Permanent bonuses | Source eligibility → player distribution within eligible group → PA ledger → H-16 effective attribute | PASS — v1.1 procedure unified |\n| External Soul Bone attacks | Independent D100 per installed piece; 01–20 trigger; obey range/LOS/accuracy; no extra Action | PASS — independent rolls, not guaranteed average |\n| Ddraig Boost | Multiplier applies to all eight primary attributes; derived stats recalculated afterward; load/overload checks | PASS — use v2.1 only |\n| Galakrond | Apply v2.1; unresolved register values remain unknown | CONDITIONAL PASS — no invented values |\n| Recovery and status | Recovery rate uses Max HP/SP; status expiry does not erase physical injury | PASS — no automatic injury healing |\n| Near Death and rescue | HP ≤ 0 Near Death; rescue timer and DC; timer expiry is not automatic Full Death | PASS — actual condition assessment required |\n| Full Death / Full Reset | Confirm Full Death; reset character/world state; preserve only Unique System persistent data | PASS — persistence boundary documented |\n| Character Window privacy | Show character-known information only | PASS — filtered view |\n| Ledger integrity | Master record + linked sub-ledgers; Run separation; append-only corrections | PASS — architecture defined |\n\n### Stress-test blockers / conditions\n\n1. A full numerical combat simulation requires a generated character and a specified encounter. Neither has been created because the game has not started.\n2. Galakrond G-10 remains gated until its authoritative wording is documented.\n3. Special Soul Bone, Divine, transformed, conscious, multi-element, and other exceptional absorptions/fusions require their specific documented rules; do not extrapolate the standard procedure beyond scope.\n4. Category 17 remains cancelled. Do not reintroduce it as an active crafting system.\n5. Character Window and Ledger are operational layouts derived from the existing categories and sources; they are not claims that a previously missing source template was found.\n\n## 11. Appendices\n\n- Appendix A — Permanent Attribute Acquisition Framework v1.1 LOCKED (separate file).\n- Appendix B — Character Window Hybrid specification (Section 9.1).\n- Appendix C — Game Master Ledger Hybrid specification (Sections 9.2–9.3).\n- Appendix D — Nightmare Stress Test (Section 10).\n- Appendix E — Source Register (Section 4 and relevant source documents).\n\n## 12. Readiness Verdict\n\n**Rules consolidation:** ready as a working integrated reference.  \n**Permanent Attribute Acquisition:** approved and locked as v1.1 by the user's explicit A1 selection.  \n**Character Window / Master Ledger:** architecture specified; can be used as the operational format without changing game mechanics.  \n**Nightmare Stress Test:** desk audit completed; no fabricated dice rolls or character outcomes.  \n**Full live-play readiness:** conditional. Before actual play, the DM must consult the authoritative special-rule sources for any applicable exception and must not fill unresolved Galakrond or special-absorption values by guesswork. A real combat stress test remains pending until there is an actual character and encounter.\n\n**No character has been created and no game has been started by this consolidation.**\n\n## 13. v0.4 Change Log\n\n- Source Register rebuilt to match Authoritative Rule Register v0.3 (adds 14 documents that v0.3 did not list; updates Unique System to v2.1 and Soul Ring & Absorption to v1.1; Galakrond now v2.1 + v2.2).\n- Core principles now state difficulty modes and the natural D100 result rule.\n- No mechanic is defined here; every rule lives in its source document. Open items: Galakrond G-10 wording; the player character sheet and Ledger for Ta'ao."}, {"name": "Harmonization_Addendum_v1.0_LOCKED", "text": "# Douluo Dalu: Another Fate — Harmonization Addendum v1.0\n\n**สถานะ:** LOCKED — ผู้เล่นอนุมัติเมื่อ 2026-11-15 (\"LOCKED ทั้งหมด\") — จัดทำตามคำสั่งผู้เล่นให้แก้ข้อที่ไม่สมเหตุสมผลหรือขัดแย้งตามสมควร  \n**หลักการ:** ไม่เขียนทับเอกสาร LOCKED ใด เอกสารนี้บอกว่าเมื่อข้อความสองแห่งขัดกันให้อ่านอย่างไร เอกสารต้นทางทั้งหมดเก็บไว้ตามเดิม\n\n## A. แก้การอ้างอิงที่ล้าสมัย (ไม่เปลี่ยนกลไก)\n\n| รหัส | ที่ไหน | ให้อ่านว่า |\n|---|---|---|\n| H-01 | Master Rulebook v0.3 ข้อ 4, ข้อ 8 อ้าง \"Galakrond v2.1\" | Galakrond v2.1 LOCKED ร่วมกับ v2.2 LOCKED (v2.2 ชนะในข้อที่ v2.2 แก้) |\n| H-02 | Galakrond Possession Temporary Attribute Rules v1.0 ข้อ 6 เรียก v2.2 ว่า \"pending DRAFT\" | v2.2 เป็น LOCKED แล้ว |\n| H-03 | ไฟล์ Galakrond v2.2 LOCKED บรรทัด Document เขียน `..._v2.2_DRAFT.md` | ชื่อเอกสารคือ `Galakrond_Rules_v2.2_LOCKED.md` |\n| H-04 | Soul Ring & Soul Bone Level Progression Bonus v1.1 อ้าง Permanent Attribute Acquisition v1.0 | Permanent Attribute Acquisition v1.1 LOCKED |\n| H-05 | Master Rulebook v0.3 Source Register ไม่มีเอกสารที่อนุมัติแล้ว | เพิ่ม: Herb and Plant Permanent Benefit v1.0, Shrek Seven Devils Personality v1.0, Opponent Full Disclosure v1.0, Galakrond Possession Temporary Attribute v1.0, Soul Ring Skill SP Cost & Cooldown v1.0, Basic Unarmed Punch v1.0, Auto-Record Policy v1.0, Galakrond v2.2 |\n| H-06 | Master Working Consolidation v0.2, Master v0.1, Audit Round 1, Galakrond ฉบับแรก/v2.0, Ddraig_Boost_Rules ฉบับแรก | เลิกใช้ เก็บเป็นประวัติเท่านั้น |\n\n## B. ข้อตัดสินที่เติมช่องว่าง (เลือกทางที่กระทบกฎเดิมน้อยที่สุด)\n\n| รหัส | ปัญหา | ข้อตัดสิน | เหตุผล |\n|---|---|---|---|\n| H-07 | Galakrond/Ddraig ใช้คำว่า MP แต่ระบบตัวละครมีแค่ SP | **MP = SP (Soul Power)** ทุกที่ \"Max MP\" = Max SP | ระบบตัวละครมีทรัพยากรเดียว ไม่มีเอกสารใดนิยาม MP แยก |\n| H-08 | Dragon Devour เพิ่มค่าสถานะ 2 แบบ | ใช้ทั้งคู่ แยกบัญชีกัน: วงที่ 4 = Permanent Bonus (+2 ครั้งเดียวต่อเป้าหมาย); Possession = Temporary Flat Bonus (+1 ต่อการกิน หายเมื่อจบ Possession) | ตรงกับ H-16 ที่แยก Permanent กับ Temporary และตรงกับบันทึกเหตุการณ์ 14 พ.ย. |\n| H-09 | HP/SP ของ NPC และ Soul Beast | ใช้สูตร Combat Formula v1.0: HP = VIT×10 + END×5 + โบนัสที่มีที่มา; SP = END×10 + VIT×3 + โบนัสที่มีที่มา ไม่มีฐาน 100/50 (Addendum ใช้กับตัวละครผู้เล่นเท่านั้น) ค่าที่บันทึกในเหตุการณ์ที่จบไปแล้วไม่แก้ย้อนหลัง | Addendum ระบุขอบเขตเฉพาะผู้เล่น; Auto-Record ห้ามแก้อดีตเงียบ ๆ |\n| H-10 | ตารางฝึก 15 นาที/30 นาที/1 ชม. ไม่มีเอกสารต้นทางในชุดไฟล์ | ใช้ค่าที่ Audit Round 1 ระบุว่า \"confirmed\": 15 นาที = Training 2 / Soul Power 0–1; 30 นาที = 5 / 1–2; 1 ชม. = 10 / 2–5; 2 ชม. = 30 / 6–12 (Phase 1) | เป็นค่าที่บันทึกว่ายืนยันแล้ว |\n| H-11 | Character & Entity Classification v1.1 LOCKED ใช้ DS0–DS3 ที่นิยามในเอกสารยังไม่ล็อก | ใช้ Soul Beast Rank v1.1, Human Transformation v1.1, Non-Soul Human v1.1 เป็น \"working reference\" สำหรับชื่อเรียกและการจัดประเภทเท่านั้น จนกว่าจะล็อก | เอกสาร LOCKED พึ่งคำศัพท์เหล่านี้อยู่แล้ว |\n| H-12 | ลำดับคำนวณเมื่อ Boost | Effective Attribute = (Base + Permanent) × Boost + Temporary Flat แล้วจึงคำนวณค่ารอง (ATK, ACC, EVA ฯลฯ) จากค่าที่ได้ ไม่คูณซ้ำ | ตาม H-16 v1.1 และ Ddraig v2.1 |\n| H-13 | วงแหวน 100,000 ปีขึ้นไป | 2 ทักษะ ทุกแหล่งที่มา | คำสั่งผู้เล่น; ดู Soul Ring & Absorption Rules v1.1 |\n| H-14 | Unique System | ใช้ v2.1 LOCKED; v2.0 DRAFT เลิกใช้; v1.0 เก็บเป็นประวัติ | คำสั่งผู้เล่น |\n\n## C. ยังแก้ไม่ได้ (ต้องมีข้อมูลจากผู้เล่น)\n\n- **Galakrond G-10** (ค่ากดทับมิติก่อนวงที่ 6): ตัวเลือก C ไม่มีข้อความในเอกสารใด ใช้ v2.1 ต่อไป (ไม่มีเปอร์เซ็นต์กลาง)\n- **ตัวละคร Ta'ao**: ไม่มีใบตัวละครและ Ledger ในไฟล์ ห้ามเดาค่า ต้องแนบ หรือสั่งเริ่มตัวละครใหม่\n- **SP ปัจจุบันของ Ta'ao (45)**: มาจากข้อสันนิษฐานในบันทึกเหตุการณ์ รอ Ledger ยืนยัน"}, {"name": "Difficulty_Mode_Framework_v1.0_LOCKED", "text": "# Difficulty Mode Framework v1.0\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** LOCKED — ค่าของแต่ละโหมดเป็นคำสั่งผู้เล่น 2026-11-15; ข้อปฏิบัติที่เหลือจัดทำตามที่ผู้เล่นมอบให้ \"จัดการตามสมควร\" (ระบุไว้ในข้อ 7)  \n**Version:** 1.0  \n**ขอบเขต:** ความแข็งแกร่งของตัวละครที่ไม่ใช่ผู้เล่น ไม่แก้สูตรใดใน Combat Formula Framework v1.0\n\n## 1. โหมดความยาก (คำสั่งผู้เล่น)\n\n| โหมด | ค่าสถานะของตัวละครอื่น | โอกาสได้ Action เพิ่มใน 1 ตา |\n|---|---:|---:|\n| ง่าย (Easy) | ไม่เปลี่ยน (×1.0) | ไม่มี |\n| ปกติ (Normal) | +20% (×1.2) | ไม่มี |\n| ยาก (Hard) | +40% (×1.4) | 20% |\n| ฝันร้าย (Nightmare) | +100% (×2.0) | 30% |\n\n## 2. ใช้กับใคร\n- ใช้กับตัวละครที่ไม่ใช่ผู้เล่นทุกตัวที่เข้าร่วมการต่อสู้หรือการตรวจ: มนุษย์ สัตว์วิญญาณ เทพ และสิ่งมีชีวิตอื่น ทั้งฝ่ายศัตรู ฝ่ายกลาง และพันธมิตร\n- ไม่ใช้กับตัวละครผู้เล่น ร่างของ Galakrond ร่างของ Ddraig และสิ่งที่ผู้เล่นอัญเชิญหรือควบคุมด้วยพลังของตนเอง\n\n## 3. ตัวคูณค่าสถานะ\n1. คูณที่ค่าสถานะหลักทั้ง 8 ค่า: `ค่าฐานตามโหมด = floor(ค่าฐาน × ตัวคูณโหมด)` ขั้นต่ำ 1\n2. จากนั้นใช้ลำดับ H-16 ตามเดิม (โบนัสถาวร ตัวคูณชั่วคราว โบนัสชั่วคราว) แล้วคำนวณค่ารอง HP/SP/ATK/DEF ฯลฯ จากค่าที่ได้ ไม่คูณค่ารองซ้ำ\n3. ค่าที่เกิน 100 จากตัวคูณนี้ถือว่ามีแหล่งที่มารองรับตาม H-16 ข้อ 1\n4. ใบสถานะศัตรู (Opponent Full Disclosure) ต้องแสดงทั้งค่าฐานและค่าหลังคูณ พร้อมชื่อโหมด\n\n## 4. Action เพิ่ม\n1. เมื่อเริ่มตาของตัวละครที่ไม่ใช่ผู้เล่นในการต่อสู้ DM ทอย D100 เปิดเผย: โหมดยาก ผล 01–20, โหมดฝันร้าย ผล 01–30 ได้ **Action เพิ่ม 1 ครั้ง** ในตานั้น\n2. ได้เพิ่มเฉพาะ Action ไม่ได้ Movement หรือ Reaction เพิ่ม และได้ไม่เกิน 1 ครั้งต่อตา\n3. Action เพิ่มใช้กฎเดิมทุกอย่าง (ค่า SP, Cooldown, ระยะ) ทักษะที่ติด Cooldown ยังใช้ไม่ได้\n4. ตัวละครที่ทำ Action ไม่ได้เพราะสถานะผิดปกติ ไม่ทอยและไม่ได้ Action เพิ่ม\n\n## 5. สิ่งที่โหมดไม่เปลี่ยน\n- กฎความตายทุกโหมดเหมือนกัน: HP 0 = Near Death, ตายสมบูรณ์ = Full Reset, DM Wishes 3 ครั้งต่อรอบ\n- DC, สูตรดาเมจ, EXP ที่ได้, Shop Pts ตามตาราง VG, ราคาร้าน, ของที่ได้ และกฎดูดซับ/หลอม ไม่เปลี่ยนตามโหมด\n- ชื่อเกม \"Nightmare Edition\" เป็นชื่อฉบับ ไม่ได้บังคับโหมดฝันร้าย\n\n## 6. การเลือกและเปลี่ยนโหมด\n1. ผู้เล่นเลือกโหมดตอนเริ่มรอบ (Run) ก่อนสร้างตัวละคร ถ้ายังไม่เลือก DM ต้องถาม ห้ามเลือกแทน\n2. เปลี่ยนโหมดกลางรอบได้เมื่อผู้เล่นสั่งชัดเจนเท่านั้น มีผลตั้งแต่การต่อสู้ครั้งถัดไป ไม่เปลี่ยนกลางการต่อสู้ และต้องบันทึกใน Ledger\n3. บันทึกเหตุการณ์ที่จบไปแล้วไม่คำนวณย้อนหลัง\n\n## 7. ข้อที่ผู้จัดทำกำหนดเอง (ไม่ใช่คำสั่งผู้เล่นโดยตรง)\nข้อ 2 (รวมพันธมิตร, ยกเว้นร่างของ Galakrond/Ddraig), ข้อ 3 (คูณที่ค่าฐานแล้วปัดลง), ข้อ 4.2–4.4, ข้อ 5 และข้อ 6 หากไม่ตรงเจตนา ให้ออกเวอร์ชันใหม่"}, {"name": "D100_Natural_Result_Rule_v1.0_LOCKED", "text": "# D100 Natural Result Rule v1.0\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** LOCKED — จัดทำ 2026-11-15 ตามที่ผู้เล่นมอบให้จัดการข้อเสนอแนะที่เหลือตามสมควร  \n**ที่มา:** ออกแบบเพื่อเกม (ไม่มีในเนื้อเรื่อง)  \n**เหตุผล:** เมื่อ Boost สูง ค่า ACC/EVA ต่างกันเกิน 100 ทำให้ผลทอย D100 ไม่มีความหมาย กฎนี้ทำให้ลูกเต๋ายังมีผลเสมอ โดยไม่แก้สูตรใดใน Combat Formula Framework v1.0\n\n## 1. กฎ\nผลทอย D100 ดิบ (ก่อนบวกค่าใด ๆ) ของฝ่ายที่ลงมือ:\n- **01–05 = ล้มเหลวเสมอ**\n- **96–100 = สำเร็จเสมอ**\n- 06–95 = ใช้สูตรตามปกติ\n\n## 2. ใช้กับ\n1. Attack Hit Check (Combat Formula ข้อ 5): ดูผลทอยของผู้โจมตีเท่านั้น 01–05 พลาด, 96–100 โดน ผลทอยของผู้ป้องกันใช้คำนวณตามปกติ\n2. Resistance Check (ข้อ 8) และ General Check (ข้อ 11): ดูผลทอยของผู้ทำการตรวจ\n\n## 3. ไม่ใช้กับ\n- การกระทำที่ DM ประกาศว่าเป็นไปไม่ได้ (ไม่มีการทอย ตามกฎเดิม) และการกระทำที่สำเร็จแน่นอน (ไม่ต้องทอย)\n- การโจมตีที่ \"หลบไม่ได้\" ตามเงื่อนไขของทักษะ\n- Critical Check (ใช้โอกาสคริติคอลตามเดิม), Initiative, การทอยดาเมจ\n- การดูดซับวงแหวน การหลอมกระดูก Overload Check และ Mastery Test ของ Ddraig, การช่วยชีวิต Near Death: ใช้ขั้นตอนในเอกสารของตนเองเท่านั้น\n\n## 4. การแสดงผล\nเมื่อผลเข้ากฎนี้ ต้องแจ้งว่า \"ผลธรรมชาติ 01–05\" หรือ \"ผลธรรมชาติ 96–100\" พร้อมสูตรปกติที่ควรจะได้ และบันทึกลง Ledger"}, {"name": "Basic_Unarmed_Punch_Damage_Rule_v1.0", "text": "# Douluo Dalu: Another Fate — Basic Unarmed Punch Damage Rule v1.0\n\n**Status:** Player-approved rule\n**Scope:** Ordinary unarmed punches only. This rule does not grant or replace a Martial Soul skill, Soul Ring skill, or Ddraig Solid Impact.\n\n## Damage formula\n\n- Each 1 point of current STR contributes **0.5 Raw Physical Damage** to an ordinary unarmed punch.\n- **Raw Punch Damage = Current STR × 0.5**.\n- Use Current STR at the moment of impact, including active attribute multipliers such as Ddraig Boost and applicable temporary bonuses.\n- This is flat raw damage; it does not require a damage-die roll.\n- Resolve a successful hit using the global Combat Formula Framework: apply the target's Physical DEF through the standard damage-reduction formula, unless a specific rule states otherwise.\n- The ordinary punch does not bypass DEF/armor and does not inherit Solid Impact's penetration effect.\n- Attack hit checks and critical-hit rules remain governed by the global Combat Formula Framework.\n\n## Example\n\nAt Current STR 1, an ordinary punch deals 0.5 Raw Physical Damage. At Current STR 100, it deals 50 Raw Physical Damage before Physical damage reduction.\n\n## Authority\n\nThis is a player-approved ordinary unarmed attack rule. It does not modify the locked global Combat Formula Framework or Ddraig rules; it supplies the previously undefined flat damage value for a basic punch."}, {"name": "Soul_Ring_Skill_SP_Cost_and_Cooldown_Rule_v1.0", "text": "# Soul Ring Skill SP Cost and Cooldown Rule v1.0\n\n**Game:** Douluo Dalu: Another Fate — Nightmare Edition  \n**Status:** Player-approved rule; applies prospectively to Soul Ring skills unless a higher-priority specific rule explicitly overrides it.\n\n## 1. Soul Power (SP) Cost by Soul Ring Number\n\nActivating a skill granted by a Soul Ring consumes SP according to the ring's sequence number:\n\n| Soul Ring | SP cost per skill activation |\n|---:|---:|\n| 1st | 5 SP |\n| 2nd | 7 SP |\n| 3rd | 9 SP |\n| 4th | 11 SP |\n| 5th | 13 SP |\n| 6th | 15 SP |\n| 7th | 17 SP |\n| 8th | 19 SP |\n| 9th | 21 SP |\n\nFormula: **SP Cost = 2 × Soul Ring Number + 3**.\n\nThe cost is paid for each activation of a Soul Ring skill. If a skill has a separately approved cost or exception, that specific rule takes precedence for that skill.\n\n## 2. Cooldown by Soul Ring Age\n\nA Soul Ring skill's base cooldown is determined by the cultivation age of the Soul Ring that grants that skill:\n\n| Soul Ring cultivation age | Cooldown after use |\n|---:|---:|\n| 10–99 years | 0 turns (no cooldown) |\n| 100–999 years | 1 turn |\n| 1,000–9,999 years | 2 turns |\n| 10,000–99,999 years | 3 turns |\n| 100,000–999,999 years | 4 turns |\n| 1,000,000–9,999,999 years | 5 turns |\n\nThe progression continues by adding one cooldown turn for each tenfold age band above the 10–99-year band.\n\nCooldown is measured in combat turns. A skill cannot be activated again while its cooldown remains. The cooldown begins after the skill's activation/resolution, whether the skill succeeds or fails, unless the skill's own approved text explicitly states otherwise.\n\n## 3. Scope and exceptions\n\n- This rule governs SP cost and cooldown only; it does not define a skill's damage, accuracy, range, action cost, effects, or target eligibility.\n- The Soul Ring number determines SP cost; the age of that specific ring determines cooldown.\n- A special skill rule with explicit resource-cost or cooldown wording overrides this general rule for that skill.\n- **Galakrond Dragon Devour exception:** Under Galakrond Rules v2.1 LOCKED, after successful absorption of the first Soul Ring, Dragon Devour is free of activation/use costs. This specific cost-free rule remains in force and is not replaced by the general Soul Ring SP cost table. No cooldown for Dragon Devour is added by this document.\n- This document does not assign or invent the name or effect of any unrecorded Soul Ring skill.\n\n## 4. Player approval and change control\n\nThe player supplied and approved the following values and progression:\n- 1st Soul Ring skill: 5 SP.\n- 2nd Soul Ring skill: 7 SP.\n- SP cost increases by 2 for each subsequent Soul Ring.\n- Cooldown age bands begin at 10–99 years = no cooldown, 100–999 = 1 turn, 1,000–9,999 = 2 turns, continuing by one turn per tenfold age band.\n\nThis is a general game rule. Changes require a new version and explicit player approval."}], "soul_ring": [{"name": "Soul_Ring_and_Absorption_Rules_v1.1_LOCKED", "text": "# Soul Ring & Absorption Rules v1.1\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** LOCKED — ผู้เล่นอนุมัติเมื่อ 2026-11-15 (\"LOCKED ทั้งหมด\")  \n**Version:** 1.1  \n**Supersedes:** Soul Ring & Absorption Rules v1.0 LOCKED (เก็บไว้ไม่แก้)  \n**สิ่งที่เปลี่ยนจาก v1.0:** เฉพาะจำนวน Skill ของวงแหวน 100,000 ปีขึ้นไป (SR-04 และข้อความที่อ้างถึง) และเพิ่มข้ออ้างอิงข้อยกเว้นของ Unique System ส่วนอื่นคงเดิมทุกตัวอักษร\n\n## 1. วัตถุประสงค์และลำดับกฎ\nกำหนดแหล่งกำเนิด การประเมินความเข้ากันได้ เงื่อนไขดูดซับ กระบวนการหลอมรวม ความเสี่ยง ความล้มเหลว และการบันทึก Soul Ring ใช้ร่วมกับ Human Soul Rank, Soul Beast Rank, EXP & Level Progression, Combat Formula, Permanent Attribute Acquisition, Character & Entity Classification และกฎเฉพาะ Galakrond/Ddraig ที่ LOCKED แล้ว หากขัดแย้งให้ยึด Core Rules และกฎเฉพาะที่ LOCKED ตามลำดับเดิม\n\n## 2. SR-01 — ประเภทและแหล่งกำเนิด\n- **SR-N Natural:** เกิดจาก Soul Beast หลังตายตามเงื่อนไขโลก\n- **SR-S Self-Condensed:** ควบแน่นจากพลังผู้ใช้/แหล่งพลังที่มีเงื่อนไขรองรับ ต้องมีหลักฐาน ความสามารถ และต้นทุน/เงื่อนไข\n- **SR-D Divine:** เกี่ยวข้องกับ Divine Power ต้องระบุ Divine Authority และเงื่อนไข\n- **SR-Special:** กรณีพิเศษ เช่น ต่างมิติ วิวัฒนาการ หรือมีจิตสำนึก ต้องมีกฎเฉพาะ/หลักฐาน\n\n## 3. SR-02 — อายุอ้างอิงมาตรฐาน\n| Ring | อายุ |\n|---|---:|\n| 1 | 423 ปี |\n| 2 | 764 ปี |\n| 3 | 1,760 ปี |\n| 4 | 5,000 ปี |\n| 5 | 12,000 ปี |\n| 6 | 20,000 ปี |\n| 7 | 30,000 ปี |\n| 8 | 50,000 ปี |\n| 9 | 100,000 ปี |\nอายุเป็นค่าอ้างอิง ไม่ใช่ข้อบังคับตายตัว ไม่มีการกำหนดสีวงแหวนเป็นมาตรฐานความแข็งแกร่งในเอกสารนี้\n\n## 4. SR-03 — Soul Ring Record\nบันทึก Ring Number/Name, Origin Type, Species/Source, Cultivation Age, Element, Bloodline Rank/Purity, Soul Beast Rank, Divine Status, Natural Abilities, Granted Skill, Permanent Attribute Bonus, Special Effects, Compatibility, Absorption Difficulty และ Result. ข้อมูลไม่มีหลักฐานให้บันทึก Unknown ห้าม DM เติมเป็นข้อเท็จจริง\n\n## 5. SR-04 — จำนวน Skill\nSoul Ring อายุต่ำกว่า 100,000 ปี หนึ่งวงให้ Main Soul Skill **1 ทักษะ**; Soul Ring อายุ **100,000 ปีขึ้นไป ให้ 2 ทักษะ** ตามเนื้อเรื่อง *Douluo Dalu* (ใช้กับวงแหวนทุกแหล่งที่มา) เว้นแต่กฎพิเศษระบุชัดเจนเป็นอย่างอื่น ไม่ได้รับ Skill Proficiency หรือ Attribute Points อัตโนมัติ Skill ต้องบันทึกประเภท Damage Type, สูตร, ระยะ, เป้าหมาย, ต้นทุน, Cooldown และผลพิเศษตาม Combat Skill Framework\n\n## 6. SR-05 — Compatibility\nประเมิน 6 ด้าน: Element, Bloodline, Martial Soul, Attribute, Soul Power และ Spiritual Compatibility. ระดับคือ Excellent, High, Moderate, Low, Incompatible. มีผลต่อ DC/เวลาใน SR-15/SR-17 แต่ไม่รับประกันผล ต้องอิงหลักฐานจริง\n\n## 7. SR-06 — เงื่อนไขก่อนดูดซับ\nต้องมีระบบพลังรองรับ ผ่านเงื่อนไขดูดซับ มี Ring Slot ว่าง มี Soul Power/การควบคุมเพียงพอ ร่างกายและวิญญาณพร้อม และวงแหวนมีแหล่งกำเนิดถูกต้อง มนุษย์มี Ring Slot มาตรฐาน 9 ช่อง Level 10 เริ่มดูดซับวงแรกได้เมื่อผ่านเงื่อนไข Breakthrough: Level 10 = H1 Soul Scholar — Breakthrough Ready; หลังดูดซับและผ่าน Breakthrough จึงเป็น Level 11/H2 Soul Master. ระบบพลังพิเศษไม่จำเป็นต้องมี Ring Slot เว้นแต่กฎเฉพาะกำหนด\n\n## 8. SR-07 — ขั้นตอน\n1. Acquisition 2. Compatibility Assessment 3. Preparation 4. Absorption Initiation 5. Soul Integration 6. Power Stabilization & Completion. DM ต้องบันทึกขั้นตอนปัจจุบัน\n\n## 9. SR-08 — D100\n**D100 + Modifiers ≥ DC = Success.** เปิดเผย DC โบนัส/โทษ ผลทอย และผลลัพธ์ ไม่ทอยโดยไม่จำเป็นในขั้นตอนไม่เสี่ยง Check ต้องมีหน้าที่ชัดเจน ห้ามทอยซ้ำทันทีแทน Check ที่ล้มเหลว ความสามารถพิเศษเปลี่ยนผลได้เฉพาะขอบเขตที่ระบุ\n\n## 10. SR-09 — Over-Age Ring\nดูดซับวงแหวนเกินขีดจำกัดมาตรฐานได้เมื่อมีหลักฐานรองรับ เช่น Martial Soul, Bloodline, ร่างกาย/วิญญาณ, External Power, Divine Power หรือ Galakrond/Ddraig ตามกฎเฉพาะ ต้องระบุแหล่งรองรับและประเมิน Compatibility ยังคงมีความเสี่ยง ไม่ยกเว้น D100 หรือให้ภูมิคุ้มกันต่อการบาดเจ็บ/เสียชีวิตโดยอัตโนมัติ\n\n## 11. SR-10 — Failure Severity และ EXP Loss\n- Minor: บาดเจ็บเล็กน้อย/พลังปั่นป่วน\n- Moderate: บาดเจ็บปานกลาง/สูญเสียการควบคุมบางส่วน\n- Severe: บาดเจ็บรุนแรง/พลังเสียสมดุล\n- Critical: อันตรายถึงชีวิต/อาจเข้าสู่ Near Death\n\n| Severity | Soul Power EXP Loss |\n|---|---:|\n| Minor | 10% |\n| Moderate | 20% |\n| Severe | 30% |\n| Critical | 50% |\nหักเฉพาะ Soul Power EXP ของ Breakthrough ปัจจุบัน ไม่หัก EXP pool อื่น HP ≤ 0 ใช้ Near Death Rules ไม่ใช่เสียชีวิตสมบูรณ์อัตโนมัติ\n\n## 12. SR-11 — Interruption\nเหตุการณ์ เช่น ถูกโจมตี ถูกบังคับเคลื่อนที่ เสียสมาธิรุนแรง ภัยพิบัติ/ระเบิดใกล้ตัว การแทรกแซงพลังวิญญาณ หรือความผิดปกติของพลังภายใน เหตุเล็กน้อยที่ไม่กระทบการควบคุมไม่นับเป็น Interruption. หากหมดสติหรือควบคุมพลังไม่ได้จะดำเนินต่ออัตโนมัติไม่ได้ ผลอาจเป็นบาดเจ็บ สูญเสียการควบคุม EXP Loss, Absorption Failure หรือ Near Death; การขัดจังหวะไม่ทำให้ Critical โดยอัตโนมัติ\n\n## 13. SR-12 — ผลสำเร็จ\nเมื่อตรวจผ่าน Check ที่จำเป็นและกระบวนการเสร็จ: ติดตั้งวงแหวน, ได้ Main Skill ตามจำนวนใน SR-04 (1 ทักษะ หรือ 2 ทักษะเมื่ออายุ 100,000 ปีขึ้นไป), ได้ Permanent Attribute Bonus ตาม PA-02, ได้ผลพิเศษที่มีสิทธิ์, ดำเนิน Breakthrough หากครบเงื่อนไข และบันทึก Record.\n\n### PA-02 Bonus ตามอายุ\n| อายุวงแหวน | โบนัสถาวร |\n|---|---:|\n| 100–999 ปี | +1 |\n| 1,000–9,999 ปี | +2 |\n| 10,000–19,999 ปี | +4 |\n| 20,000–49,999 ปี | +6 |\n| 50,000–99,999 ปี | +8 |\n| 100,000–199,999 ปี | +12 |\n| 200,000–499,999 ปี | +16 |\n| 500,000–999,999 ปี | +20 |\n| 1,000,000 ปีขึ้นไป | +25 |\nจัดสรรภายในกลุ่ม Attribute ที่แหล่งกำเนิดอนุญาต ใช้ Hybrid Distribution ตาม PA และห้ามรับโบนัสซ้ำจากแหล่งเดิม\n\n## 14. SR-13 — กรณีพิเศษ\nOver-Age, Divine, Transformed Soul Beast, Conscious Ring, Multi-Element, Evolving Ring, Multi-Martial Soul, Galakrond และ Ddraig Special Absorption ต้องประเมินตามกฎเฉพาะ/หลักฐาน ห้ามอนุมานว่าอนุญาตโดยอัตโนมัติ\n\n## 15. SR-14 — Absorption Record\nบันทึก Character, Ring Number/Name, Origin, Species/Source, Age, Compatibility, Base/Final DC, Check Count, D100 Results, Modifiers, Failure/Success, Granted Skill, Permanent Attribute Bonus, Special Effects, Start/Completion Time, Injuries/Effects, EXP Loss และ Level/Rank หลังจบ\n\n## 16. SR-15 — DC ตามอายุและ Compatibility\n### Base DC\n| อายุ | Base DC |\n|---|---:|\n| 1–999 ปี | 20 |\n| 1,000–9,999 ปี | 30 |\n| 10,000–19,999 ปี | 40 |\n| 20,000–49,999 ปี | 50 |\n| 50,000–99,999 ปี | 60 |\n| 100,000–199,999 ปี | 70 |\n| 200,000–499,999 ปี | 80 |\n| 500,000–999,999 ปี | 90 |\n| 1,000,000 ปีขึ้นไป | 95 |\n\n### Compatibility Modifier\n| ระดับ | Modifier |\n|---|---:|\n| Excellent | −15 |\n| High | −10 |\n| Moderate | 0 |\n| Low | +10 |\n| Incompatible | +20 |\n\n**Final DC = Base DC + Compatibility Modifier + Special Modifier.** จำกัด DC ต่ำสุด 5 สูงสุด 100. Special Modifier ใช้เมื่อมีเหตุผลรองรับ เช่น บาดเจ็บ วิญญาณเสียหาย หรือพลังขัดแย้ง\n\n## 17. SR-16 — จำนวนและจังหวะ Check\n### จำนวน Check หลัก\n| อายุ | Check |\n|---|---:|\n| 1–999 ปี | 2 |\n| 1,000–9,999 ปี | 3 |\n| 10,000–19,999 ปี | 3 |\n| 20,000–49,999 ปี | 4 |\n| 50,000–99,999 ปี | 4 |\n| 100,000–199,999 ปี | 5 |\n| 200,000–499,999 ปี | 5 |\n| 500,000–999,999 ปี | 6 |\n| 1,000,000 ปีขึ้นไป | 7 |\n\n### Stage Modifier\n| Check | ขั้นตอน | Modifier |\n|---|---|---:|\n| 1 | Absorption Initiation | −5 |\n| 2 | Soul Integration | 0 |\n| 3 | Power Stabilization | +5 |\n| 4 | Advanced Integration | +5 |\n| 5 | Advanced Integration | +10 |\n| 6 | Advanced Integration | +10 |\n| 7 | Advanced Integration | +15 |\n\n**DC ของแต่ละ Check = Final DC + Stage Modifier**, จำกัด 5–100. Success ผ่านขั้นตอน; **Failure = Absorption Failure ทันที** และเข้าสู่ Failure Severity. ไม่มีการทอยซ้ำทันที ความสามารถเฉพาะเปลี่ยนผลได้เมื่อกฎระบุชัดเจน\n\n## 18. SR-17 — ระยะเวลาการดูดซับ\n### เวลามาตรฐาน\n| อายุ | เวลา |\n|---|---:|\n| 1–999 ปี | 15 นาที |\n| 1,000–9,999 ปี | 30 นาที |\n| 10,000–19,999 ปี | 1 ชั่วโมง |\n| 20,000–49,999 ปี | 2 ชั่วโมง |\n| 50,000–99,999 ปี | 4 ชั่วโมง |\n| 100,000–199,999 ปี | 6 ชั่วโมง |\n| 200,000–499,999 ปี | 8 ชั่วโมง |\n| 500,000–999,999 ปี | 12 ชั่วโมง |\n| 1,000,000 ปีขึ้นไป | 24 ชั่วโมง |\n\nแบ่งเวลา: Preparation 10%, Absorption Initiation 15%, Soul Integration 40%, Power Stabilization 25%, Completion 10%. ปัดเป็นนาทีและปรับเศษให้ผลรวมตรงเวลามาตรฐาน\n\n### Compatibility Time Modifier\n| Compatibility | เวลา |\n|---|---:|\n| Excellent | ลด 25% |\n| High | ลด 10% |\n| Moderate | ตามมาตรฐาน |\n| Low | เพิ่ม 25% |\n| Incompatible | เพิ่ม 50% |\nการลดเวลาไม่ลดจำนวน Check หรือ DC โดยอัตโนมัติ ดูดซับทีละวง หลังสำเร็จประเมินร่างกายและวิญญาณใหม่ การดูดซับต่อเนื่องไม่ปลอดภัยโดยอัตโนมัติ ระยะพักฟื้นขึ้นกับสภาพจริง\n\n## 19. SR-18 — Interruption Rules\n### Interruption Modifier\n| ความรุนแรง | Modifier |\n|---|---:|\n| Minor | +0 |\n| Moderate | +5 |\n| Severe | +10 |\n| Critical | +20 |\n\n**Interruption DC = Final DC + Stage Modifier + Interruption Modifier**, จำกัด 5–100.\n\n**D100 + Interruption Resistance ≥ Interruption DC = Success.** โบนัส/โทษต้องมาจาก Attribute, Ability หรือความสามารถป้องกันที่มีจริง\n\nSuccess: ควบคุมกระบวนการต่อได้ แต่ยังรับความเสียหายจากการโจมตี และไม่ภูมิคุ้มกันต่อการขัดจังหวะครั้งต่อไป. Failure: กระบวนการถูกรบกวน ประเมินความเสียหาย/ผลสะท้อนกลับ และอาจดูดซับล้มเหลว\n\n| ผลต่ำกว่า DC | Severity |\n|---|---|\n| 1–10 | Minor |\n| 11–20 | Moderate |\n| 21–30 | Severe |\n| 31 ขึ้นไป | Critical |\n\nผล: Minor บาดเจ็บเล็กน้อยและสูญเสีย Soul Power EXP 10%; Moderate บาดเจ็บปานกลางและสูญเสีย 20%; Severe บาดเจ็บรุนแรงและสูญเสีย 30%; Critical อันตรายถึงชีวิต สูญเสีย 50% และอาจเข้าสู่ Near Death. หากหมดสติหรือควบคุมพลังไม่ได้ กระบวนการล้มเหลวทันที\n\n## 20. ความสอดคล้องกับกฎเดิม\n1. Soul Ring Requirement แยกจาก EXP Requirement\n2. Breakthrough ต้องใช้ EXP, Soul Ring และ Successful Absorption\n3. Level 10 = H1 Soul Scholar — Breakthrough Ready; เมื่อผ่านจึงเป็น Level 11/H2 Soul Master\n4. Soul Ring ให้ Main Skill 1 ทักษะ; อายุ 100,000 ปีขึ้นไปให้ 2 ทักษะ\n5. EXP ไม่เพิ่ม Skill Proficiency อัตโนมัติ\n6. Permanent Attribute Bonus ใช้ PA-02\n7. EXP Loss หักเฉพาะ Soul Power EXP ของ Breakthrough ปัจจุบัน\n8. HP ≤ 0 ใช้ Near Death Rules\n9. Galakrond/Ddraig ใช้กฎเฉพาะของตน\n10. ไม่มีโบนัสหรือสิทธิพิเศษนอกเหนือจากที่ระบุ\n\n## 21. ข้อยกเว้นของ Unique System (เพิ่มใน v1.1)\nSoul Ring ที่เจ้าของ Unique System ได้รับโดยตรงจากระบบ ใช้ Unique System Framework v2.1 ข้อ 6.10.8: ดูดซับสำเร็จอัตโนมัติ ไม่ใช้ DC, Check, ผลล้มเหลว หรือข้อจำกัดอายุ/Level ของเอกสารนี้ แต่ยังใช้ระยะเวลา, Ring Slot, Breakthrough Gate, PA-02 และการบันทึก Record ตามเอกสารนี้ วงแหวนจากแหล่งอื่นใช้กฎในเอกสารนี้เต็มรูปแบบ\n\n## 22. สถานะเอกสาร\n**Soul Ring & Absorption Rules v1.1 — APPROVED, LOCKED (2026-11-15).** แทนที่ v1.0 การแก้ไขต้องออกเวอร์ชันใหม่และได้รับอนุมัติอย่างชัดเจน\n\n**End of Document**"}, {"name": "Soul_Ring_Soul_Bone_Level_Progression_Bonus_v1.1_LOCKED", "text": "# Soul Ring & Soul Bone Level Progression Bonus v1.1\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** APPROVED — LOCKED\n**Version:** 1.1\n**Supersedes:** Soul Ring & Soul Bone Level Progression Bonus v1.0\n\n---\n\n## 1. วัตถุประสงค์\n\nปรับปรุงระบบ Level Bonus จาก Soul Ring และ Soul Bone โดยเพิ่มกฎการจัดการโบนัสคงค้างเมื่อถึง Breakthrough Gate, การจัดการโบนัสเมื่อถึง Level 100 และการเพิ่มสิทธิ์ Level Bonus ให้ External Soul Bone\n\nกฎ v1.1 ยังคงรักษาหลักการของ v1.0 ได้แก่ โบนัส Level เป็นการเพิ่ม Level โดยตรง ไม่ใช่ EXP และไม่ยกเว้นเงื่อนไข Breakthrough\n\n## 2. หลักการร่วม\n\n1. ได้รับ Level Bonus เฉพาะเมื่อ Soul Ring ดูดซับสำเร็จ หรือ Soul Bone ผ่านกระบวนการติดตั้ง/หลอมรวมสำเร็จตามกฎที่เกี่ยวข้อง\n2. หากกระบวนการล้มเหลว ถูกยกเลิก หรือไม่สำเร็จสมบูรณ์ จะไม่ได้รับ Level Bonus\n3. โบนัสเป็น Level โดยตรง ไม่ต้องใช้ Soul Power EXP\n4. ทุก Level ที่เพิ่มขึ้นจริงได้รับ 2 Attribute Points ตามกฎ Level Up\n5. ไม่เพิ่ม Skill Proficiency โดยอัตโนมัติ\n6. โบนัส Level แยกจาก Permanent Attribute Bonus\n7. Soul Ring หรือ Soul Bone ชิ้นเดิมไม่สามารถให้โบนัสซ้ำจากการวิวัฒนาการ เพิ่มอายุ เปลี่ยนคุณสมบัติ ถอด หรือติดตั้งใหม่\n8. โบนัสไม่ยกเว้น EXP Requirement, Soul Ring Requirement, Ring Slot Requirement, Compatibility, Absorption, Fusion หรือ Breakthrough\n9. โบนัส Level จากแหล่งต่าง ๆ สามารถสะสมเป็นยอดโบนัสคงค้างได้\n\n## 3. Soul Ring Level Bonus\n\nเมื่อดูดซับ Soul Ring สำเร็จ ให้ทอยหนึ่งครั้งต่อวง\n\n| อายุ Soul Ring | Level Bonus |\n|---|---:|\n| 1–99 ปี | ไม่ได้รับโบนัส |\n| 100–999 ปี | 1d2 |\n| 1,000–9,999 ปี | 1d2 + 1 |\n| 10,000–19,999 ปี | 1d2 + 2 |\n| 20,000–49,999 ปี | 1d2 + 3 |\n| 50,000–99,999 ปี | 1d2 + 4 |\n| 100,000–199,999 ปี | 1d2 + 5 |\n| 200,000–499,999 ปี | 1d2 + 6 |\n| 500,000–999,999 ปี | 1d2 + 7 |\n| 1,000,000 ปีขึ้นไป | 1d2 + 8 |\n\n## 4. Standard Soul Bone Level Bonus\n\nใช้กับ Soul Bone หลักทั้ง 6 ตำแหน่ง ได้แก่ Skull, Torso, Left Arm, Right Arm, Left Leg และ Right Leg\n\nเมื่อหลอมรวม Soul Bone สำเร็จ ให้ทอยหนึ่งครั้งต่อชิ้น\n\n| อายุ Soul Bone | Level Bonus |\n|---|---:|\n| 10,000–19,999 ปี | 1d2 |\n| 20,000–49,999 ปี | 1d2 + 1 |\n| 50,000–99,999 ปี | 1d2 + 2 |\n| 100,000–199,999 ปี | 1d2 + 3 |\n| 200,000–499,999 ปี | 1d2 + 4 |\n| 500,000–999,999 ปี | 1d2 + 5 |\n| 1,000,000 ปีขึ้นไป | 1d2 + 6 |\n\n## 5. External Soul Bone Level Bonus\n\nExternal Soul Bone ได้รับ Level Bonus เมื่อผ่านกระบวนการติดตั้ง/หลอมรวมสำเร็จตามกฎที่เกี่ยวข้อง\n\nทอยหนึ่งครั้งต่อ External Soul Bone หนึ่งชิ้น\n\n| อายุ External Soul Bone | Level Bonus |\n|---|---:|\n| ต่ำกว่า 10,000 ปี | 1d2 |\n| 10,000–19,999 ปี | 1d2 |\n| 20,000–49,999 ปี | 1d2 + 1 |\n| 50,000–99,999 ปี | 1d2 + 2 |\n| 100,000–199,999 ปี | 1d2 + 3 |\n| 200,000–499,999 ปี | 1d2 + 4 |\n| 500,000–999,999 ปี | 1d2 + 5 |\n| 1,000,000 ปีขึ้นไป | 1d2 + 6 |\n\nเงื่อนไข:\n1. ต้องติดตั้ง/หลอมรวมสำเร็จเท่านั้น\n2. ทอยแยกต่อชิ้น\n3. ชิ้นเดิมให้โบนัสได้เพียงครั้งเดียว\n4. จำนวนและตำแหน่งติดตั้งยังเป็นไปตาม Permanent Attribute Acquisition Framework\n5. การได้รับ Level Bonus ไม่ได้ยกเว้นข้อจำกัดการติดตั้งหรือการห้ามคุณสมบัติซ้ำ\n\n## 6. Breakthrough Gate และ Pending Level Bonus\n\n### 6.1 หลักการ\n\nเมื่อได้รับ Level Bonus ให้เพิ่ม Level ตามปกติจนถึง Breakthrough Gate\n\nหากโบนัสยังเหลือหลังจากถึง Gate:\n- หยุดการเพิ่ม Level ที่ Gate\n- เก็บโบนัสที่เหลือทั้งหมดเป็น Pending Level Bonus\n- ไม่สูญเสียโบนัส\n- ไม่สามารถใช้โบนัสคงค้างเพื่อข้าม Gate ได้\n\n### 6.2 การใช้โบนัสคงค้าง\n\nเมื่อผ่าน Breakthrough สำเร็จ:\n1. เพิ่ม Level ตามผล Breakthrough\n2. นำ Pending Level Bonus มาใช้ต่อทันที\n3. หากถึง Gate ถัดไป ให้หยุดและเก็บยอดที่เหลือทั้งหมด\n4. ทำซ้ำจนกว่าโบนัสจะหมด หรือถึงขีดจำกัด Level ที่ระบบรองรับ\n\nหาก Breakthrough ยังไม่สำเร็จ โบนัสทั้งหมดจะยังคงค้างอยู่\n\n### 6.3 ตัวอย่าง\n\nตัวละคร Level 19 ได้ Level Bonus จำนวน 5:\n- เพิ่มจาก Level 19 เป็น Level 20\n- เข้าสถานะ Breakthrough Ready\n- Pending Level Bonus เหลือ 4\n- เมื่อผ่าน Breakthrough จะเป็น Level 21\n- ใช้โบนัสคงค้างต่อจาก Level 21 เป็น Level 25\n- Pending Level Bonus เหลือ 0\n\nอีกตัวอย่างหนึ่ง:\n\nตัวละคร Level 18 ได้โบนัส 25 Level:\n- เพิ่มถึง Level 20\n- เหลือโบนัสคงค้าง 23\n- ผ่าน Breakthrough เป็น Level 21\n- เพิ่มต่อถึง Level 30\n- เหลือโบนัสคงค้าง 14\n- หยุดที่ Level 30 จนกว่าจะผ่าน Breakthrough ครั้งถัดไป\n\n## 7. การจัดการเมื่อถึง Level 100\n\n1. Level 100 เป็นขอบเขตสูงสุดของ Human Soul Progression ตามระบบปัจจุบัน\n2. หากมี Pending Level Bonus เหลือเมื่อถึง Level 100 ให้เก็บยอดทั้งหมดไว้\n3. ห้ามเพิ่ม Level เกิน 100 โดยอัตโนมัติ\n4. ห้ามแปลง Pending Level Bonus เป็น Divine Power, Divine EXP, Attribute Points หรือทรัพยากรอื่นโดยอัตโนมัติ\n5. เมื่อมีระบบความก้าวหน้าใหม่ที่รองรับ Level หลังจาก 100 จึงจะนำโบนัสคงค้างไปใช้ได้ตามเงื่อนไขของระบบใหม่นั้น\n6. หากระบบใหม่ไม่รองรับการเพิ่ม Level โบนัสจะยังคงค้างอยู่โดยไม่มีการแปลงค่า\n\n## 8. Attribute Points\n\n1. ทุก Level ที่เพิ่มขึ้นจริงได้รับ 2 Attribute Points\n2. Level ที่ยังเป็น Pending Level Bonus ยังไม่ถือว่าเพิ่มขึ้นจริง\n3. Pending Level Bonus จึงยังไม่ให้ Attribute Points\n4. Attribute Points ต้องจัดสรรตามกฎ Attribute เดิม\n5. ไม่เพิ่ม Skill Proficiency โดยอัตโนมัติ\n\n## 9. ลำดับการดำเนินการ\n\n1. ตรวจสอบว่าการดูดซับหรือหลอมรวมสำเร็จสมบูรณ์\n2. บันทึก Soul Ring/Soul Bone และ Permanent Attribute Bonus ตามกฎต้นทาง\n3. ตรวจสอบว่าชิ้นดังกล่าวเคยให้ Level Bonus แล้วหรือไม่\n4. ทอย Level Bonus ตามตารางที่เกี่ยวข้อง\n5. เพิ่ม Level จนถึง Breakthrough Gate หรือขีดจำกัด Level ที่ระบบรองรับ\n6. บันทึก Pending Level Bonus ที่เหลือ\n7. มอบ Attribute Points เฉพาะ Level ที่เพิ่มจริง\n8. เมื่อผ่าน Breakthrough ให้ดำเนินการใช้ Pending Level Bonus ต่อทันที\n9. บันทึกผลทั้งหมดใน Character Progression Record\n\n## 10. การบันทึกข้อมูล\n\nต้องบันทึก:\n- ชนิดและชื่อ Soul Ring/Soul Bone\n- อายุและแหล่งกำเนิด\n- ผลการดูดซับ/หลอมรวม/ติดตั้ง\n- Level Bonus Table และผลทอย\n- Level ก่อนและหลังการเพิ่ม\n- Attribute Points ที่ได้รับ\n- Pending Level Bonus\n- Breakthrough Ready/Completed Status\n- ประวัติการใช้โบนัสคงค้าง\n- สถานะการให้โบนัสของแหล่งกำเนิดนั้น\n\n## 11. ความสอดคล้องกับกฎเดิม\n\n- Soul Ring & Absorption Rules v1.0 ยังคงใช้กับการดูดซับและความเสี่ยงทั้งหมด\n- Soul Bone Fusion Rules เดิมยังคงใช้กับการหลอมรวมและความเสี่ยงทั้งหมด\n- Permanent Attribute Acquisition Framework v1.0 ยังคงใช้กับ Permanent Attribute Bonus\n- EXP & Level Progression Framework ยังคงใช้กับ EXP, Attribute Points และ Breakthrough\n- Human Soul Rank Framework ยังคงใช้กับ Level และ Rank\n- HP/SP Growth Bonus v1.0 ยังคงใช้ตามเดิม\n- กฎ Galakrond และ Ddraig ไม่ได้รับผลกระทบ\n- ไม่มีการสร้างสิทธิพิเศษหรือข้อยกเว้นอื่นนอกเหนือจากที่ระบุในเอกสารนี้\n\n## 12. สถานะเอกสาร\n\n**Soul Ring & Soul Bone Level Progression Bonus v1.1 — APPROVED, LOCKED**\n\nการแก้ไขในอนาคตต้องออกเวอร์ชันใหม่และได้รับอนุมัติอย่างชัดเจน\n\n**End of Document**"}, {"name": "Permanent_Attribute_Acquisition_Framework_v1.1_LOCKED", "text": "# Permanent Attribute Acquisition Framework v1.1\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**Status:** LOCKED — explicitly approved by the player on 2026-11-14  \n**Supersedes:** v1.0 Reconstructed Draft for the unified distribution procedure  \n**Scope:** Permanent Attribute bonuses from eligible Soul Ring absorption, Standard Soul Bone fusion, and External Soul Bone installation/fusion.\n\n## 1. PA-01 — Permanent Attribute Principle\n\nOn successful absorption or fusion of an eligible source, the character receives the relevant Ability where applicable and the Permanent Attribute Bonus defined for that source. The bonus is permanent, is not a temporary buff, is not lost merely because an item is removed or destroyed, grants no extra AP/EXP/Skill Proficiency, and must be recorded by source. Failed absorption/fusion grants none. Evolution of the same source grants only the difference.\n\n`Effective Attribute = (Base Attribute + Permanent Bonus) × Temporary Multiplier + Temporary Flat Bonus`\n\n## 2. PA-02 — Soul Ring Bonus\n\n| Age | Bonus |\n|---|---:|\n| 100–999 years | +1 |\n| 1,000–9,999 years | +2 |\n| 10,000–19,999 years | +4 |\n| 20,000–49,999 years | +6 |\n| 50,000–99,999 years | +8 |\n| 100,000–199,999 years | +12 |\n| 200,000–499,999 years | +16 |\n| 500,000–999,999 years | +20 |\n| 1,000,000+ years | +25 |\n\nThe source / applicable rule determines the eligible attribute group.\n\n## 3. PA-03 — Standard Soul Bone Bonus\n\n| Age | Bonus |\n|---|---:|\n| 10,000–19,999 years | +5 |\n| 20,000–49,999 years | +8 |\n| 50,000–99,999 years | +12 |\n| 100,000–199,999 years | +18 |\n| 200,000–499,999 years | +24 |\n| 500,000–999,999 years | +30 |\n| 1,000,000+ years | +40 |\n\nEligible groups:\n- Skull: INT / WIS / PER / WILL\n- Torso: VIT / END / WILL\n- Arms: STR / AGI\n- Legs: AGI / END\n\n## 4. PA-04 — External Soul Bone Bonus\n\n| Age | Bonus |\n|---|---:|\n| Under 10,000 years | +3 |\n| 10,000–19,999 years | +6 |\n| 20,000–49,999 years | +10 |\n| 50,000–99,999 years | +15 |\n| 100,000–199,999 years | +22 |\n| 200,000–499,999 years | +30 |\n| 500,000–999,999 years | +40 |\n| 1,000,000+ years | +50 |\n\nEligible attributes are determined by actual function and source.\n\n## 5. PA-05 — External Installation Capacity\n\nMaximum 18 External Soul Bone pieces across six positions: Skull, Torso, Left Arm, Right Arm, Left Leg, Right Leg. Each position holds up to three pieces. These slots are additional to the six Standard Soul Bone positions.\n\n## 6. PA-06 — Duplicate Core Properties\n\nExternal Soul Bones with duplicate core properties / functional organs cannot be installed together. Wing + Wing prohibited; Wing + Tail allowed; Tail + Claw allowed; Wing + Armor allowed. Assess multi-property items by actual function.\n\n## 7. PA-07 — External Soul Bone Attacks\n\nEach installed piece independently has a 20% chance per eligible character Action. Roll D100 per piece: 01–20 triggers an attack attempt; 21–100 does not. At 18 pieces, roll 18 independent checks; expected average 3.6 attempts, not a guarantee. Each triggered attack must satisfy range, line of sight / cover, targeting conditions, and Accuracy Check, and use its own damage type and formula. These do not grant extra normal Actions or turns. If the character cannot take an Action due to a Status Condition, no piece triggers for that Action.\n\n## 8. PA-08 — Independent Rolls\n\nRoll each piece independently. The expected average is not a guaranteed result in any one Action.\n\n## 9. PA-09 — No Duplicate Rewards\n\nThe same source cannot grant the same permanent reward more than once in a campaign Run, including resurrection, duplication, recreation, or transformation of that same source. Evolution grants only the difference.\n\n## 10. PA-10 — Permanent Attribute Ledger\n\nRecord source identity/type, age/quality/origin, absorption or fusion date and outcome, eligible attribute group, distribution, amount, source status, evolution history, and whether reward was already granted.\n\n## 11. PA-11 — Distribution Procedure (Unified)\n\nApply one procedure to Soul Rings, Standard Soul Bones, and External Soul Bones:\n1. Verify source identity, age, eligibility, and successful absorption/fusion/installation as applicable.\n2. DM identifies the eligible Attribute group supported by that source and its applicable rules.\n3. Player distributes the awarded bonus only within that eligible group.\n4. Record the source, eligible group, distribution, and total in the Permanent Attribute Ledger.\n5. Calculate Effective Attribute using H-16.\n\nThe eligible group must be established before distribution. This procedure does not change bonus amounts, grant permission to distribute outside the eligible group, or create additional Attribute Points. If the source rule specifies a fixed allocation, that specific rule takes precedence.\n\n## 12. PA-12 — Example\n\n10,000-year Soul Ring +4; 100,000-year Standard Soul Bone +18; 100,000-year External Soul Bone +22. Total awarded across eligible allocations is +44. Record and distribute each source separately.\n\n## 13. Integration\n\nThis framework does not change H-16, Combat Formula, Soul Ring Absorption, Soul Bone Fusion, Level Progression Bonus, EXP Requirement, HP/SP Growth Bonus, or Galakrond / Ddraig rules. Permanent Attribute Bonus remains distinct from Level Bonus and Attribute Points.\n\n## Change Log — v1.1\n\n- Unified the eligibility and distribution procedure for all three source types.\n- Preserved all approved bonus tables and source restrictions.\n- Clarified that fixed source-specific allocations, if any, take precedence.\n- Player explicitly selected A1 and approved v1.1 as LOCKED on 2026-11-14."}], "soul_bone": [{"name": "Soul_Bone_Fusion_Rules_v1.0_LOCKED", "text": "# Soul Bone Fusion Rules v1.0\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**Status:** APPROVED — LOCKED  \n**Version:** 1.0\n\n## 1. Scope and Principles\n\nSoul Bone is part of the user's spiritual power and body structure, not ordinary wearable equipment. Fusion affects the body, soul, Soul Power, abilities, and character development.\n\n1. A character must complete Fusion to receive Soul Bone benefits.\n2. Possessing a Soul Bone does not mean it can be installed immediately.\n3. Age is the primary factor for quality and power.\n4. Species, Power, Element, Ability, and Compatibility are supporting factors.\n5. Fusion may succeed, cause injury, fail, or cause death.\n6. Every Fusion must be recorded in the Soul Bone Ledger.\n7. The same Soul Bone cannot grant duplicate rewards.\n\n## 2. Soul Bone Types and Positions\n\n### 2.1 Standard Soul Bone\n\nThere are six standard positions, with one Soul Bone per position:\n\n| Position | Primary function |\n|---|---|\n| Skull | Mind, senses, spiritual power |\n| Torso | Central body structure, life force |\n| Left Arm | Left-arm capability |\n| Right Arm | Right-arm capability |\n| Left Leg | Left-leg capability |\n| Right Leg | Right-leg capability |\n\n### 2.2 External Soul Bone\n\n- Separate from the six standard positions.\n- Uses Permanent Attribute Acquisition Framework PA-04 through PA-07.\n- Installation capacity is 18 pieces.\n- Duplicate properties must be checked under PA-06.\n- Uses the Fusion/Installation procedure in this document unless a specific ability states otherwise.\n\n### 2.3 Special Soul Bone\n\nSoul Bones with Divine, Bloodline, Evolutionary, External, or Consciousness properties require specific conditions based on their origin. Such properties do not automatically exempt them from Fusion.\n\n## 3. Pre-Fusion Requirements\n\nAssess these seven dimensions before Fusion:\n\n| Code | Requirement | Description |\n|---|---|---|\n| FB-01 | Body Compatibility | The body can support the Soul Bone |\n| FB-02 | Soul Compatibility | The soul can support its power structure |\n| FB-03 | Soul Po

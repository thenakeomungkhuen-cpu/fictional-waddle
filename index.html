wer Capacity | Sufficient power capacity |\n| FB-04 | Power Control | Ability to control the power |\n| FB-05 | Position Compatibility | Correct Soul Bone position |\n| FB-06 | Element Compatibility | No severe elemental conflict |\n| FB-07 | Special Compatibility | Bloodline, Divine, and special properties |\n\nAssessment grades: Excellent, High, Moderate, Low, Incompatible.\n\nIncompatible does not prohibit every Fusion, but greatly increases risk and may require a special ability to support the process.\n\nThe DM must disclose information the character can investigate before Fusion, without revealing information the character has no means to know.\n\n## 4. Compatibility Modifier\n\n| Compatibility | DC Modifier |\n|---|---:|\n| Excellent | -15 |\n| High | -10 |\n| Moderate | 0 |\n| Low | +10 |\n| Incompatible | +20 |\n\nWhen several dimensions are assessed, determine one final overall Compatibility grade. Do not add every dimension's modifier together.\n\n## 5. Soul Bone Age and Base DC\n\n| Soul Bone age | Base DC |\n|---|---:|\n| 1–999 years | 20 |\n| 1,000–9,999 years | 30 |\n| 10,000–19,999 years | 40 |\n| 20,000–49,999 years | 50 |\n| 50,000–99,999 years | 60 |\n| 100,000–199,999 years | 70 |\n| 200,000–499,999 years | 80 |\n| 500,000–999,999 years | 90 |\n| 1,000,000+ years | 95 |\n\n`Final DC = Clamp(Base DC + Compatibility Modifier + Condition Modifier, 5, 100)`\n\n### Condition Modifier\n\n| Condition | Modifier |\n|---|---:|\n| Fully prepared | -5 |\n| Normal condition | 0 |\n| Injured or fatigued | +5 |\n| Seriously injured | +10 |\n| Unstable power | +15 |\n| Multiple serious adverse conditions | +20 |\n\nThe DM determines the Condition Modifier from physical condition, readiness, support equipment, environment, and Soul Bone abnormalities. Do not apply the same condition more than once.\n\n## 6. Fusion Checks and Stages\n\nThe six main stages are:\n\n1. Initial Integration — begin connecting the Soul Bone to the body.\n2. Body Adaptation — the body accepts the structure.\n3. Soul Integration — connect with the soul.\n4. Power Synchronization — synchronize Soul Power.\n5. Ability Integration — integrate the Soul Bone's ability.\n6. Final Stabilization — complete and stabilize Fusion.\n\n### Number of Checks by Age\n\n| Soul Bone age | Checks |\n|---|---:|\n| 1–999 years | 2 |\n| 1,000–9,999 years | 3 |\n| 10,000–19,999 years | 3 |\n| 20,000–49,999 years | 4 |\n| 50,000–99,999 years | 4 |\n| 100,000–199,999 years | 5 |\n| 200,000–499,999 years | 5 |\n| 500,000–999,999 years | 6 |\n| 1,000,000+ years | 7 |\n\nCheck formula: `D100 + Modifiers >= DC`.\n\n### Stage DC Modifier\n\n| Check | Modifier |\n|---|---:|\n| 1 | -5 |\n| 2 | 0 |\n| 3 | +5 |\n| 4 | +5 |\n| 5 | +10 |\n| 6 | +10 |\n| 7 | +15 |\n\nEach Check has a specific purpose. Do not immediately reroll a failed Check as a substitute for that Check.\n\n**If any main Check fails, Fusion ends immediately and proceeds to Failure Resolution. Do not continue the remaining Checks.**\n\n## 7. Fusion Duration\n\n| Soul Bone age | Base duration |\n|---|---:|\n| 1–999 years | 15 minutes |\n| 1,000–9,999 years | 30 minutes |\n| 10,000–19,999 years | 1 hour |\n| 20,000–49,999 years | 2 hours |\n| 50,000–99,999 years | 4 hours |\n| 100,000–199,999 years | 6 hours |\n| 200,000–499,999 years | 8 hours |\n| 500,000–999,999 years | 12 hours |\n| 1,000,000+ years | 24 hours |\n\nTime allocation:\n\n| Stage | Share |\n|---|---:|\n| Preparation | 10% |\n| Initial Integration | 15% |\n| Body & Soul Integration | 40% |\n| Power Stabilization | 25% |\n| Final Completion | 10% |\n\nCompatibility time modifier:\n\n| Compatibility | Time adjustment |\n|---|---:|\n| Excellent | -25% |\n| High | -10% |\n| Moderate | 0% |\n| Low | +25% |\n| Incompatible | +50% |\n\nThis is the base duration. It excludes pauses and time spent addressing interruption consequences.\n\n## 8. Failed Checks and Failure Outcomes\n\n`Failure Gap = DC - (D100 + Modifiers)`\n\n| Failure Gap | Severity |\n|---|---|\n| 1–10 | Minor |\n| 11–20 | Moderate |\n| 21–30 | Severe |\n| 31+ | Critical |\n\n| Severity | Possible consequences |\n|---|---|\n| Minor | Pain, weakness, temporary HP loss |\n| Moderate | Internal injury, HP/SP loss, or abnormal condition |\n| Severe | Organ damage, unstable Soul Power, or permanent injury |\n| Critical | Severe body and soul damage; may cause Near Death or death |\n\nActual consequences depend on the failed stage. For example, failure during Body Adaptation emphasizes physical harm, while failure during Soul Integration emphasizes soul damage.\n\n### Soul Bone Condition After Failed Fusion\n\n- The Soul Bone is not automatically destroyed.\n- It may be damaged depending on failure severity and circumstances.\n- The DM records damage to the Soul Bone separately from damage to the character.\n- A damaged Soul Bone may require restoration or repair before reuse.\n- Repair does not grant Fusion rewards again.\n\nIf HP is 0 or lower, use the Core Near Death Rules; this does not automatically mean complete death.\n\n## 9. Interruption Rules\n\nInterruptions during Fusion are dangerous. Examples include being attacked, the character becoming unconscious, Soul Power being cut off, destruction of the location, external power interference, or Soul Bone abnormalities.\n\n| Interruption severity | Modifier |\n|---|---:|\n| Minor | +0 |\n| Moderate | +5 |\n| Severe | +10 |\n| Critical | +20 |\n\n`Interruption DC = Final DC + Stage Modifier + Interruption Modifier`\n\nOn failure, use the Failure Gap and Failure Severity in Section 8.\n\nUnconsciousness or complete loss of power control is an interruption requiring immediate assessment.\n\n## 10. Partial Fusion\n\nThere is no Partial Success outcome.\n\n- Every main Check must succeed for Fusion to be successful.\n- If any Check fails, terminate the process immediately.\n- Failed Fusion grants no Permanent Attribute Bonus or Level Bonus.\n- An ability that has not been successfully integrated is not acquired.\n\n## 11. Rewards for Successful Fusion\n\nOn Complete Success, rewards are governed by the applicable rules:\n\n| Reward | Governing rule |\n|---|---|\n| Soul Bone Ability | Ability belonging to the Soul Bone |\n| Permanent Attribute Bonus | PA-03 |\n| Level Bonus | Soul Ring & Soul Bone Level Progression Bonus v1.1 |\n| HP/SP | Combat Formula and HP/SP Growth Bonus |\n| Skill Proficiency | No automatic increase |\n| EXP | No automatic award |\n\nRestrictions:\n\n1. Each Soul Bone grants rewards only once.\n2. Evolution of the same Soul Bone does not grant duplicate rewards.\n3. Failed Fusion grants no Permanent Attribute Bonus.\n4. Level Bonus is granted only after complete Fusion success.\n5. Pending Level Bonus at a Breakthrough Gate follows v1.1.\n6. Attribute Bonus must be recorded under PA-10.\n\n## 12. Soul Bone Removal and Replacement\n\nAn installed Soul Bone may be removed only through **Controlled Removal**.\n\nRemoval requires a capable practitioner and suitable tools. Assess:\n- Physical condition\n- Soul condition\n- Soul Power stability\n- Attachment between Soul Bone and body\n- Risks from special properties\n\nPossible consequences include injury, HP/SP loss, soul damage, loss of access to some abilities, or permanent injury in severe cases.\n\nPermanent Attribute Bonus already granted by successful Fusion is not removed when the Soul Bone is removed or destroyed, under PA-01.\n\nA replacement requires removal of the existing Soul Bone first. Two Soul Bones cannot occupy the same standard position.\n\n## 13. Soul Bone Evolution\n\nSoul Bone may evolve through increased age or power, Bloodline Evolution, Elemental Evolution, Divine Evolution, or Special Evolution.\n\nEvolution does not make it a new Soul Bone. Permanent Attribute Acquisition PA-09 and Level Bonus v1.1 prohibit duplicate rewards from the same source.\n\nChanges to abilities require clear evidence and conditions.\n\n## 14. Special Soul Bone\n\nSpecial Soul Bone records must include:\n- Origin\n- Soul Beast Species\n- Cultivation Age\n- Bloodline\n- Element\n- Power Type\n- Special Ability\n- Consciousness\n- Compatibility\n- Fusion Restriction\n- Failure Consequence\n\nA Soul Bone with Consciousness may resist its wielder, but not every Soul Bone is conscious. Divine or Transcendent Soul Bone may have additional origin-specific requirements.\n\n## 15. Soul Bone Ledger\n\nEvery Fusion attempt must record:\n\n| Field | Information |\n|---|---|\n| Identity | Soul Bone name and ID |\n| Origin | Origin |\n| Age | Age |\n| Position | Position |\n| Compatibility | Assessment |\n| Base DC | Base DC |\n| Final DC | Adjusted DC |\n| Check Records | All Check results |\n| Duration | Duration |\n| Outcome | Success/Failure |\n| Injury | Damage and injury |\n| Ability | Ability acquired |\n| Attribute Bonus | Permanent bonus |\n| Level Bonus | Level bonus |\n| Removal Status | Removal status |\n| Evolution Status | Evolution status |\n\n## 16. Calculation Example\n\nA 100,000-year Soul Bone has High Compatibility and the character is in Normal condition:\n\n- Base DC = 70\n- Compatibility = -10\n- Condition = 0\n\n`Final DC = 70 - 10 = 60`\n\nThe Fusion requires 5 Checks.\n\n| Check | Stage Modifier | DC |\n|---|---:|---:|\n| 1 | -5 | 55 |\n| 2 | 0 | 60 |\n| 3 | +5 | 65 |\n| 4 | +5 | 65 |\n| 5 | +10 | 70 |\n\nExample D100 totals: 71, 68, 75, 80, 73. All Checks pass, so Fusion succeeds completely. The character then receives the Soul Bone Ability, Permanent Attribute Bonus under PA-03, rolls Level Bonus under v1.1, and records the Soul Bone Ledger.\n\nThis is a calculation example, not an actual in-game roll.\n\n## 17. Integration with Other Rules\n\nThis document must not conflict with:\n- Combat Formula Framework v1.0\n- EXP Requirement Framework v1.1\n- Phase 1 Consolidated Rules v1.0\n- Permanent Attribute Acquisition Framework v1.0\n- Soul Ring & Soul Bone Level Progression Bonus v1.1\n- HP/SP Growth Bonus v1.0\n- Soul Ring & Absorption Rules v1.0\n- Galakrond Rules v2.1\n- Ddraig Rules v2.1\n- Core Near Death and Full Reset Rules\n\nGalakrond and Ddraig specific rules retain authority within their respective scopes.\n\n## 18. Version Control\n\n- Document: Soul Bone Fusion Rules\n- Version: 1.0\n- Status: APPROVED — LOCKED\n- SB-01: A — terminate Fusion immediately when a main Check fails.\n- SB-02: A — no Partial Success.\n- SB-03: A — Soul Bone is not automatically destroyed after failure; it may be damaged according to severity.\n- SB-04: A — Controlled Removal only.\n- SB-05: A — use the proposed duration table unchanged.\n- SB-06: A — use the proposed Base DC and Modifiers unchanged.\n- User notes: None.\n\nAny future amendment requires a new version and explicit user approval.\n\n**End of Document**"}, {"name": "Permanent_Attribute_Acquisition_Framework_v1.1_LOCKED", "text": "# Permanent Attribute Acquisition Framework v1.1\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**Status:** LOCKED — explicitly approved by the player on 2026-11-14  \n**Supersedes:** v1.0 Reconstructed Draft for the unified distribution procedure  \n**Scope:** Permanent Attribute bonuses from eligible Soul Ring absorption, Standard Soul Bone fusion, and External Soul Bone installation/fusion.\n\n## 1. PA-01 — Permanent Attribute Principle\n\nOn successful absorption or fusion of an eligible source, the character receives the relevant Ability where applicable and the Permanent Attribute Bonus defined for that source. The bonus is permanent, is not a temporary buff, is not lost merely because an item is removed or destroyed, grants no extra AP/EXP/Skill Proficiency, and must be recorded by source. Failed absorption/fusion grants none. Evolution of the same source grants only the difference.\n\n`Effective Attribute = (Base Attribute + Permanent Bonus) × Temporary Multiplier + Temporary Flat Bonus`\n\n## 2. PA-02 — Soul Ring Bonus\n\n| Age | Bonus |\n|---|---:|\n| 100–999 years | +1 |\n| 1,000–9,999 years | +2 |\n| 10,000–19,999 years | +4 |\n| 20,000–49,999 years | +6 |\n| 50,000–99,999 years | +8 |\n| 100,000–199,999 years | +12 |\n| 200,000–499,999 years | +16 |\n| 500,000–999,999 years | +20 |\n| 1,000,000+ years | +25 |\n\nThe source / applicable rule determines the eligible attribute group.\n\n## 3. PA-03 — Standard Soul Bone Bonus\n\n| Age | Bonus |\n|---|---:|\n| 10,000–19,999 years | +5 |\n| 20,000–49,999 years | +8 |\n| 50,000–99,999 years | +12 |\n| 100,000–199,999 years | +18 |\n| 200,000–499,999 years | +24 |\n| 500,000–999,999 years | +30 |\n| 1,000,000+ years | +40 |\n\nEligible groups:\n- Skull: INT / WIS / PER / WILL\n- Torso: VIT / END / WILL\n- Arms: STR / AGI\n- Legs: AGI / END\n\n## 4. PA-04 — External Soul Bone Bonus\n\n| Age | Bonus |\n|---|---:|\n| Under 10,000 years | +3 |\n| 10,000–19,999 years | +6 |\n| 20,000–49,999 years | +10 |\n| 50,000–99,999 years | +15 |\n| 100,000–199,999 years | +22 |\n| 200,000–499,999 years | +30 |\n| 500,000–999,999 years | +40 |\n| 1,000,000+ years | +50 |\n\nEligible attributes are determined by actual function and source.\n\n## 5. PA-05 — External Installation Capacity\n\nMaximum 18 External Soul Bone pieces across six positions: Skull, Torso, Left Arm, Right Arm, Left Leg, Right Leg. Each position holds up to three pieces. These slots are additional to the six Standard Soul Bone positions.\n\n## 6. PA-06 — Duplicate Core Properties\n\nExternal Soul Bones with duplicate core properties / functional organs cannot be installed together. Wing + Wing prohibited; Wing + Tail allowed; Tail + Claw allowed; Wing + Armor allowed. Assess multi-property items by actual function.\n\n## 7. PA-07 — External Soul Bone Attacks\n\nEach installed piece independently has a 20% chance per eligible character Action. Roll D100 per piece: 01–20 triggers an attack attempt; 21–100 does not. At 18 pieces, roll 18 independent checks; expected average 3.6 attempts, not a guarantee. Each triggered attack must satisfy range, line of sight / cover, targeting conditions, and Accuracy Check, and use its own damage type and formula. These do not grant extra normal Actions or turns. If the character cannot take an Action due to a Status Condition, no piece triggers for that Action.\n\n## 8. PA-08 — Independent Rolls\n\nRoll each piece independently. The expected average is not a guaranteed result in any one Action.\n\n## 9. PA-09 — No Duplicate Rewards\n\nThe same source cannot grant the same permanent reward more than once in a campaign Run, including resurrection, duplication, recreation, or transformation of that same source. Evolution grants only the difference.\n\n## 10. PA-10 — Permanent Attribute Ledger\n\nRecord source identity/type, age/quality/origin, absorption or fusion date and outcome, eligible attribute group, distribution, amount, source status, evolution history, and whether reward was already granted.\n\n## 11. PA-11 — Distribution Procedure (Unified)\n\nApply one procedure to Soul Rings, Standard Soul Bones, and External Soul Bones:\n1. Verify source identity, age, eligibility, and successful absorption/fusion/installation as applicable.\n2. DM identifies the eligible Attribute group supported by that source and its applicable rules.\n3. Player distributes the awarded bonus only within that eligible group.\n4. Record the source, eligible group, distribution, and total in the Permanent Attribute Ledger.\n5. Calculate Effective Attribute using H-16.\n\nThe eligible group must be established before distribution. This procedure does not change bonus amounts, grant permission to distribute outside the eligible group, or create additional Attribute Points. If the source rule specifies a fixed allocation, that specific rule takes precedence.\n\n## 12. PA-12 — Example\n\n10,000-year Soul Ring +4; 100,000-year Standard Soul Bone +18; 100,000-year External Soul Bone +22. Total awarded across eligible allocations is +44. Record and distribute each source separately.\n\n## 13. Integration\n\nThis framework does not change H-16, Combat Formula, Soul Ring Absorption, Soul Bone Fusion, Level Progression Bonus, EXP Requirement, HP/SP Growth Bonus, or Galakrond / Ddraig rules. Permanent Attribute Bonus remains distinct from Level Bonus and Attribute Points.\n\n## Change Log — v1.1\n\n- Unified the eligibility and distribution procedure for all three source types.\n- Preserved all approved bonus tables and source restrictions.\n- Clarified that fixed source-specific allocations, if any, take precedence.\n- Player explicitly selected A1 and approved v1.1 as LOCKED on 2026-11-14."}], "galakrond": [{"name": "Galakrond_Rules_v2.1_LOCKED", "text": "# GALAKROND — SPECIAL MARTIAL SOUL RULES\n\n**Document:** Galakrond_Rules_v2.1_LOCKED.md  \n**Project:** Douluo Dalu: Another Fate — Nightmare Edition  \n**Status:** PLAYER-APPROVED — LOCKED  \n**Replaces:** Galakrond_Rules.md (as the working draft only; the original remains historical reference)  \n**Scope:** First Martial Soul — Galakrond, True Dragon from another dimension\n\n---\n\n## 0. Document Control and Authority\n\n1. This document governs Galakrond-specific traits, powers, manifestations, and interactions.\n2. It does not override the game's Core Rules, Character System, Soul Power System, Martial Soul System, Combat System, Death System, or other approved category rules.\n3. Where this document is silent, the relevant approved core category applies. The DM must not invent a permanent rule to fill a gap without player approval.\n4. Galakrond's special nature does not grant automatic success, immunity, unlimited resources, or unrestricted access to abilities.\n5. This is a complete structural rewrite of the prior Galakrond reference. Existing established rules and values are carried forward unless explicitly marked as unresolved. No new numerical balance values are silently introduced.\n\n## 1. Identity, Origin, and Nature\n\n### 1.1 True Dragon\n- Galakrond originates from another dimension, specifically the dimension/world associated with Hearthstone, and is an existence that should not naturally exist in the Douluo Dalu world.\n- Galakrond's arrival and appearance cause the planet to tremble violently. Powerful beings and the gods can sense this tremendous disturbance, but they do not automatically know its source or what caused it.\n- The laws and structure of the Douluo Dalu world suppress almost all of Galakrond's original power, causing it to lose nearly all of its former strength. However, Galakrond retains some of its original power and nature.\n- Galakrond's status as a cross-dimensional existence grants it the new classification **True Dragon** in this world.\n- The exact amount of power suppressed and the amount retained have not been assigned numerical values.\n\n### 1.2 Passive Skill — Dragon Supremacy\nGalakrond's True Dragon nature exerts bloodline suppression over dragons whose bloodlines are inferior to its own.\n\n**Eligible targets:** Dragons with a bloodline lower than Galakrond's. This passive is specifically draconic suppression; it does not automatically affect every non-draconic creature.\n\n**Stun chance:**\n- Ordinary dragons or lower-level draconic beings: **50% chance** to become Stunned.\n- High-level dragons or powerful draconic bloodlines that remain below Galakrond's hierarchy: **25% chance** to become Stunned.\n\n**Approved target-classification criteria:**\n\n1. **Ordinary dragon / ordinary draconic being — 50% Stun chance**\n   - Ordinary dragon bloodlines.\n   - Beings with diluted or secondary draconic blood that do not possess an ancient, royal, or otherwise elevated dragon lineage.\n   - Creatures whose combat power has increased through training or external means, but whose bloodline has not correspondingly evolved.\n\n2. **High-level dragon / high-level draconic being — 25% Stun chance**\n   - Beings with ancient or royal dragon bloodlines.\n   - Special dragon species whose origin or lineage is superior to ordinary dragons.\n   - Beings possessing a highly pure dragon bloodline or a high-grade draconic core.\n   - Dragon rulers or beings with power/status comparable to a Dragon King, provided they are not among the explicit exceptions below.\n\nA target qualifies as high-level if it meets at least one of the high-level criteria above. The DM must consider bloodline, power, and origin together; combat power alone does not automatically promote an ordinary bloodline to the high-level category. Physical size and current HP are not classification criteria by themselves. Before resolving the effect, the DM must state the category and the facts supporting that classification. If available information is insufficient, the classification remains uncertain and must be handled transparently rather than guessed as fact.\n\n**Explicit exceptions:** This passive does not affect the following beings: Gods, the Dragon God King, the Golden Dragon King, and the Silver Dragon King.\n\nThe Stun chance represents a chance to inflict the Stunned condition, not guaranteed fear, submission, or control. Resolve the chance through the game's D100 framework, with 1–50 indicating success for the 50% tier and 1–25 indicating success for the 25% tier, subject to the approved check procedure and any applicable immunity or resistance rules. This passive does not grant automatic victory or override a higher-priority core rule.\n\nThis passive does not grant automatic victory and does not override a target's explicit immunity or a higher-priority core rule.\n\n### 1.3 Relationship to the Wielder\n- Galakrond is the first Martial Soul associated with the player character.\n- The degree of awareness, personality, communication, cooperation, and autonomy may develop over time; see Section 8.\n- Galakrond's growth does not automatically cause the wielder to evolve, and the wielder's growth does not automatically cause Galakrond to evolve.\n\n## 2. Core Ability — Dragon Devour (Ring-Unlocked System)\n\nDragon Devour is Galakrond's signature ability. Its functions are unlocked and enhanced through the acquisition of specific Soul Rings. This section replaces all previous Dragon Devour stages, Tier-based MP costs, target-assessment procedures, digestion rules, assimilation rules, chance checks, and associated mechanics.\n\n### 2.1 Core Operation and Guaranteed Consumption\n- Dragon Devour can consume defeated dragons and other defeated living beings that Galakrond can physically or spiritually consume.\n- A target must be defeated before it can be consumed. Defeated does not necessarily mean dead; the target's actual condition must be clear in the scene.\n- **Once an eligible target is selected and Dragon Devour is used, consumption succeeds automatically.** There is no D100 check, failure chance, resistance roll, interruption roll, or failed-consumption outcome for Dragon Devour itself.\n- This guarantee applies to the act of consumption. It does not remove the eligibility requirement: an undefeated target, an ineligible target, or an object that Dragon Devour cannot consume is not a valid target and cannot be consumed under this rule.\n- The ability's ring-unlocked permanent-growth effects are determined by the Soul Rings successfully acquired and absorbed by the wielder.\n- Receiving a Soul Ring unlocks its corresponding Dragon Devour function; it does not automatically grant unrelated skills or abilities belonging to the consumed target.\n- Dragon Devour no longer uses the former three-stage process of Devouring, Digestion, and Assimilation. Those stages and their separate checks, costs, delays, interruption rules, and outcomes are removed.\n- The former Tier 1–10 Base MP Cost table and all former Additional MP Cost rules are removed.\n\n### 2.2 Cost Rule After the First Soul Ring\nOnce the wielder has obtained and successfully absorbed the **first Soul Ring**, Dragon Devour costs no resources to activate or use. There is no MP cost or other activation cost for consuming an eligible target.\n\nThis cost-free rule removes all resource and activation costs belonging to Dragon Devour itself. It does not cancel unrelated conditions or consequences imposed by other approved core rules. No former Dragon Devour MP surcharge may be reintroduced through case-by-case DM judgment.\n\nThe cost of using Dragon Devour before the first Soul Ring has not yet been specified and must not be invented. The automatic-consumption rule does not create an unapproved pre-first-ring cost or override the first-ring unlock requirement.\n\n### 2.3 Soul Ring Unlocks and Permanent-Growth Effects\n\n| Soul Ring | Unlocked function / effect |\n|---:|---|\n| 1st | Unlocks Dragon Devour. After this ring is successfully absorbed, Dragon Devour becomes completely cost-free. |\n| 2nd | **Permanent Max HP Growth:** Each successful consumption grants permanent Max HP equal to 1% of the target's Base Max HP, subject to the calculation rules in Section 2.4. |\n| 3rd | **Permanent Max MP Growth:** Each successful consumption grants permanent Max MP equal to 1% of the target's Base Max MP, subject to the calculation rules in Section 2.4. |\n| 4th | **Permanent Attribute Growth:** Each successful consumption grants +2 to one randomly selected eligible primary attribute, subject to the attribute eligibility and cap rules in Section 2.4. |\n| 5th | **Enhanced Devour:** Increases the amount of each applicable permanent-growth effect from the 2nd–4th rings by 10% (×1.1). It does not add a chance check; Dragon Devour's eligible consumption and applicable permanent-growth effects are guaranteed. |\n| 6th | **Dimensional Suppression Release:** Removes the dimensional/world-law suppression that had sealed or suppressed Galakrond's original power. The exact restored power profile is governed by Galakrond's established origin and the world's rules; this unlock does not itself invent additional abilities. |\n| 7th | **Galakrond True Martial Soul Avatar:** Instead of transforming the wielder into a conventional Martial Soul Avatar, the wielder summons Galakrond into the world as a separate manifested entity. At the moment of summoning, Galakrond's base attributes are equal to the wielder's corresponding attributes. |\n| 8th | **Manifested Galakrond Enhancement I:** Increases the attributes of the summoned Galakrond by **50%**. |\n| 9th | **Manifested Galakrond Enhancement II:** Further increases the attributes of the summoned Galakrond by **100% multiplicatively after the 8th-ring enhancement**. The calculation is: wielder base attributes × 1.5 × 2.0 = **3.0× base attributes (300%)** when both enhancements apply. |\n\n### 2.4 Permanent-Growth Calculation and Application\n**A. Target reference values**\n- Use the target's Base Max HP and Base Max MP before temporary buffs, debuffs, transformations, or temporary resource modifiers.\n- The target must possess a valid, measurable Base Max HP or Base Max MP value for the corresponding growth effect to apply.\n- A target without a valid value for a particular resource does not grant growth in that resource category.\n\n**B. 2nd-ring Max HP growth**\n- Without the 5th Soul Ring: `HP Gain = max(1, floor(Target Base Max HP × 0.01))`.\n- With the 5th Soul Ring: `HP Gain = max(1, floor(Target Base Max HP × 0.01 × 1.1))`.\n- The result is added permanently to the wielder's Max HP. The wielder's current HP is also restored by the same amount, but cannot exceed the new Max HP.\n\n**C. 3rd-ring Max MP growth**\n- Without the 5th Soul Ring: `MP Gain = max(1, floor(Target Base Max MP × 0.01))`.\n- With the 5th Soul Ring: `MP Gain = max(1, floor(Target Base Max MP × 0.01 × 1.1))`.\n- The result is added permanently to the wielder's Max MP. The wielder's current MP is also restored by the same amount, but cannot exceed the new Max MP.\n\n**D. 4th-ring attribute growth**\n- Select one attribute at random from STR, AGI, VIT, END, INT, WIS, PER, and WILL, limited to attributes that can still legally increase.\n- The base gain is +2 to the selected attribute.\n- With the 5th Soul Ring, calculate `floor(2 × 1.1)`, which remains **+2**.\n- If the selected attribute is already at its applicable cap, reroll among eligible attributes. If no primary attribute can legally increase, no attribute gain is applied.\n- Attribute gains remain subject to the game's normal cap of 100 unless a separately approved special rule explicitly permits exceeding it.\n- Fractional attribute gains are discarded. They are not banked, carried forward, or transferred to another attribute.\n\n**E. 5th-ring multiplier**\n- No 5th Soul Ring: multiplier ×1.0.\n- With 5th Soul Ring: multiplier ×1.1.\n- The multiplier applies to the amount gained, not to a success probability. No 10% or 20% success chance remains in this version.\n\n### 2.5 Automatic Resolution and Once-Per-Target Limit\n- Dragon Devour has no success roll. Eligible consumption is automatic, and all permanent-growth effects unlocked by the wielder's rings are applied automatically when the consumed target has the corresponding valid properties.\n- The 2nd-, 3rd-, and 4th-ring effects are not separate chance checks. They are all applied from the same successful consumption, provided the target supports each effect.\n- A target can provide Dragon Devour permanent-growth benefits only once during the entire campaign run, regardless of how many applicable Soul Rings the wielder has at the time.\n- The once-per-target restriction applies even if the target is later resurrected, split into multiple bodies, transformed, copied, recreated, or otherwise returned in another form.\n- A body, creature, or entity created from the wielder's own power cannot be consumed as a source of permanent Dragon Devour growth.\n- After consumption, the DM must immediately record the target's identity/status as consumed for Dragon Devour growth and update the wielder's permanent Max HP, Max MP, and attributes as applicable.\n- The random selection of the attribute under the 4th-ring effect remains random. This is a selection of which attribute increases, not a chance for the growth effect to fail.\n\n\n## 8. Consciousness, Personality, and Wielder Relationship\n\n- Galakrond may possess awareness from the beginning or develop consciousness gradually through growth and the progression of its Soul Ring abilities.\n- Its personality, reasoning, communication, and degree of autonomy depend on its development.\n- Trust and cooperation between Galakrond and the wielder must develop through shared experience; they are not automatically maximized.\n- Galakrond may refuse, reinterpret, or fail to follow a command depending on its consciousness, nature, relationship with the wielder, and circumstances.\n- Some abilities may be controllable immediately; others require practice, synchronization, or mastery.\n- The exact consciousness stage, personality profile, communication method, and obedience boundaries are character-specific and have not been numerically defined.\n\n## 9. Independent Manifestation\n\nGalakrond may develop or create an independent body or manifestation if its evolution, core, stability, and resources permit.\n\n### 9.1 Independent Body Functions\nAn independent body may, depending on its development:\n- Regenerate itself.\n- Use MP or stored energy.\n- Possess special operating conditions or limitations.\n- Change its appearance or size within the limits of its structure and stability.\n- Conceal its power level, disguise its energy signature, or hide its identity, while remaining potentially detectable.\n- Communicate with or perceive through the wielder, subject to range and connection limitations.\n- Use Dragon Devour and abilities unlocked through its Soul Rings fully, partially, or not at all.\n\n### 9.2 Destruction of an Independent Body\nIf an independent body is destroyed, possible outcomes include:\n- Returning to or merging back into the wielder/Galakrond.\n- Requiring a recovery period or resources to reform.\n- Losing some or all stored energy.\n- Losing a secondary consciousness.\n- Permanent destruction or death of that manifestation, if its core structure makes this possible.\n\nThe result depends on the body's core, consciousness, stored energy, and current condition. Destruction of a manifestation is not automatically equivalent to the death of the main Galakrond consciousness.\n\n### 9.3 Range and Connection\n- Distance may limit control, communication, perception, or energy transfer.\n- Sensory sharing depends on distance and the quality of the connection.\n- A body may be able to operate independently for a time, or may require a continuing link.\n- No fixed range, duration, or connection formula has yet been approved.\n\n### 9.4 Re-creation\nCreating a replacement body may be immediate, require resources, require time, or be impossible under current conditions. The result depends on evolution, core integrity, available energy, and the state of the relevant consciousness.\n\n## 10. Multiple Independent Bodies and Secondary Consciousnesses\n\nGalakrond may create more than one independent body if its evolution and core structure can support them.\n\n- The maximum number of bodies depends on the ability to divide or sustain core power and the resources available.\n- Memories may be shared immediately, synchronized later, or remain separate, depending on the established connection.\n- Each body may be centrally controlled or possess partial autonomy.\n- **The primary consciousness has authority over secondary consciousnesses whenever their decisions or commands conflict.** This hierarchy is an established rule and is carried forward unchanged.\n- If a body with a secondary consciousness is destroyed, that consciousness may return to the primary consciousness, remain stored in the core, or be permanently lost, depending on the integrity of the consciousness and core.\n- Re-creating a body from a stored secondary consciousness requires assessment of consciousness integrity, core condition, energy, and body structure.\n\nNo fixed maximum body count, division ratio, synchronization interval, or independent-body resource cost has been approved.\n\n## 11. Interaction with Other Systems\n\n1. **Core and Character Rules:** All permanent attribute changes, HP/MP changes, conditions, checks, and death consequences follow their approved core systems.\n2. **Martial Soul Rules:** Galakrond remains the first Martial Soul; its special nature does not erase general Martial Soul requirements unless an explicit approved exception exists.\n3. **Soul Ring and Soul Bone Rules:** Dragon Devour’s ring-unlocked effects do not replace the normal acquisition and absorption rules for Soul Rings or the rules governing Soul Bones. The ability does not automatically consume Soul Rings, Soul Bones, weapons, or other non-living objects.\n4. **Combat Rules:** Dragon Devour consumption itself is automatic for eligible targets and does not use combat checks or resistance rolls. Any separate hostile action used to defeat, restrain, or make a target eligible remains governed by the approved combat/check framework.\n5. **Ddraig / Sacred Gear:** Interactions with Ddraig must be assessed for compatibility. Neither power automatically reduces the other's costs or removes its limitations.\n6. **World Laws:** Dimensional suppression and other world-level effects remain in force unless a documented ability or event specifically changes them.\n\n## 12. DM Adjudication and Player Disclosure\n\nFor any significant Dragon Devour, Soul Ring ability activation, evolution, independent-body creation, or multi-body action, the DM should state before resolution whenever reasonably possible:\n- What the wielder knows about the target or process.\n- Which facts are confirmed, estimated, or unknown.\n- Whether the target meets Dragon Devour eligibility requirements.\n- The applicable permanent-growth calculations and the target values used.\n- Any separate costs or risks arising from actions taken to defeat or restrain the target.\n\nThe DM must not introduce a failure chance, resistance roll, or activation cost for Dragon Devour itself when the target is eligible. The DM must still disclose separate material costs or risks belonging to other actions or systems.\n\n## 13. Unresolved Rules Register\n\nThe following details remain undefined and must not be invented as established rules:\n\n| ID | Unresolved item | Current handling |\n|---|---|---|\n| G-01 | Dragon Devour cost before the 1st Soul Ring | Not specified; do not invent a cost. The 1st ring unlocks the ability and makes it cost-free after successful absorption. |\n| G-02 | Exact target eligibility boundaries for unusual beings, constructs, or nonstandard life forms | Apply the core eligibility rule: the target must be defeated and physically or spiritually consumable by Galakrond; disclose uncertain edge cases and do not invent blanket eligibility. |\n| G-06 | Whether the 6th-ring release restores all original Galakrond abilities immediately or only removes suppression | Suppression is removed; restored ability list and usable power must be reconciled with origin/lore and core rules |\n| G-07 | Whether 7th-ring summoned Galakrond copies only primary attributes or also derived attributes, equipment, conditions, and temporary effects | Base attributes equal the wielder's at summoning; detailed copy scope requires clarification |\n| G-08 | Stacking calculation for 8th-ring +50% and 9th-ring +100% | RESOLVED: multiplicative stacking; ×1.5 ×2.0 = ×3.0 (300%) of base attributes |\n| G-09 | Summoning duration, cooldown, activation cost, and recovery after manifestation is defeated | Follow applicable core rules where possible; no Galakrond-specific values approved |\n| G-10 | Exact dimensional suppression values before the 6th Soul Ring | No universal percentage; suppression remains a world-law effect |\n| G-11 | Exact consciousness development stages | Character-specific; not yet defined |\n| G-12 | Numerical thresholds for bloodline purity, power, or rank in Dragon Supremacy edge cases | Use the approved qualitative criteria in Section 1.2; disclose rationale; no numeric threshold approved |\n\n## 14. Change Log\n\n### v2.0 Draft — Full Structural Rewrite\n- Reorganized the prior Galakrond document into identity, Dragon Devour, costs, target assessment, digestion, assimilation, growth, consciousness, independent bodies, system interactions, and unresolved rules.\n- Preserved the existing Tier 1–10 Base MP Cost table exactly.\n- Preserved the three Dragon Devour stages and the rule that no stage guarantees the next.\n- Preserved the primary-consciousness authority over secondary consciousnesses.\n- Clarified that consuming a target does not automatically grant all of its powers or properties.\n- Corrected inconsistent/garbled references to the wielder into consistent terminology.\n- Explicitly marked unapproved numerical formulas and limits as unresolved rather than inventing values.\n\n### v2.0 Draft — Player-Provided Origin and True Dragon Traits\n- Added the Hearthstone-dimension origin and the planetary tremor caused by Galakrond's appearance.\n- Clarified that powerful beings and gods sense the disturbance but do not automatically identify its source.\n- Added the world's suppression of almost all original power while preserving some original power.\n- Added the cross-dimensional **True Dragon** classification.\n- Added Passive Skill **Dragon Supremacy**, with a 50% Stun chance against ordinary lower-bloodline dragons and a 25% Stun chance against high-level lower-bloodline dragons.\n- Recorded the explicit exceptions: Gods, the Dragon God King, the Golden Dragon King, and the Silver Dragon King.\n- Clarified that living Dragon Devour targets must have been defeated.\n- Added the player-approved qualitative classification criteria for ordinary and high-level dragons under Dragon Supremacy. Numerical thresholds for ambiguous edge cases remain unresolved.\n\n---\n\n### v2.1 LOCKED — Dragon Devour Guaranteed Consumption and Permanent Growth Defined\n- Replaced all Dragon Devour success chances with guaranteed consumption of eligible defeated targets; no activation, resistance, interruption, or consumption-failure roll applies to Dragon Devour itself.\n- Defined the 2nd-ring permanent Max HP gain as 1% of target Base Max HP, rounded down with a minimum gain of 1.\n- Defined the 3rd-ring permanent Max MP gain as 1% of target Base Max MP, rounded down with a minimum gain of 1.\n- Defined the 4th-ring effect as a guaranteed +2 to one randomly selected eligible primary attribute per consumed target.\n- Defined the 5th-ring effect as a ×1.1 increase to permanent-growth amounts; it no longer changes a success probability because no growth success chance remains.\n- Confirmed that with the 5th ring, attribute growth is floor(2 × 1.1) = +2; fractional attribute amounts are discarded and never banked.\n- Confirmed that all unlocked growth categories apply automatically from one consumption when the target has the corresponding valid properties.\n- Confirmed the once-per-target-per-campaign-run restriction, including resurrection, duplication, transformation, or recreation of the same target.\n- Updated DM adjudication and system-interaction text to distinguish guaranteed Dragon Devour consumption from separate combat actions required to make a target eligible.\n- Marked the exact HP, MP, attribute, and 5th-ring calculations as resolved; unusual target eligibility remains subject to transparent adjudication.\n\n\n**Approval note:** The player explicitly approved this complete v2.1 document on 2026-11-14. This is the active LOCKED Galakrond rules version. Changes require a new version and explicit player approval.\n\n\n### v2.0 Draft — Dragon Supremacy Classification Approved\n- Recorded player approval of the full target-classification proposal.\n- Defined ordinary lower-bloodline dragons as the 50% Stun category and high-level lower-bloodline dragons as the 25% Stun category.\n- Added the approved qualitative indicators for ordinary and high-level dragon classification, including bloodline, origin, purity, and power/status.\n- Clarified that combat power, physical size, or current HP alone do not determine the category.\n- Retained the explicit immunity exceptions and left numeric thresholds for edge cases unresolved.\n\n### v2.0 Draft — Dragon Devour Replaced by Soul-Ring Unlock Progression\n- Replaced the former Dragon Devour three-stage process and its associated digestion, assimilation, target-tier, MP-cost, additional-cost, and interruption mechanics.\n- Established that the 1st Soul Ring unlocks Dragon Devour and that, after successful absorption of the 1st ring, Dragon Devour has no activation or use cost.\n- Added the 2nd-ring 10% chance to gain target HP as permanent Max HP and the 3rd-ring 10% chance to gain target MP as permanent Max MP.\n- Added the 4th-ring 10% chance to double a permanent attribute gain from Dragon Devour.\n- Added the 5th-ring +10% effectiveness enhancement to the preceding Dragon Devour functions, without silently increasing their trigger chances.\n- Added the 6th-ring release of dimensional/world-law suppression.\n- Replaced the conventional 7th-ring Martial Soul Avatar with summoning Galakrond into the world, initially with attributes equal to the wielder.\n- Added the 8th-ring +50% and 9th-ring +100% attribute enhancements to summoned Galakrond; the exact stacking calculation remains pending clarification.\n- Removed the former Tier 1–10 Dragon Devour MP cost table and all former three-stage mechanics from the active draft.\n- Listed remaining numerical and implementation details in the Unresolved Rules Register instead of inventing values.\n\n\n### v2.0 Draft — 8th/9th Soul Ring Stacking Method Approved\n- Recorded player approval of multiplicative stacking for the 8th- and 9th-ring summoned-Galakrond attribute bonuses.\n- Defined the calculation as base attributes × 1.5 × 2.0 = 3.0× (300%) when both rings apply.\n- Marked the stacking-method item in the Unresolved Rules Register as resolved."}, {"name": "Galakrond_Rules_v2.2_LOCKED", "text": "# GALAKROND — SPECIAL MARTIAL SOUL RULES\n## Special Rules v2.2 — LOCKED\n\n**Document:** `Galakrond_Rules_v2.2_DRAFT.md`  \n**Project:** Douluo Dalu: Another Fate — Nightmare Edition  \n**Status:** PLAYER-APPROVED — LOCKED (2026-11-14)  \n**Parent / protected source:** `Galakrond_Rules_v2.1_LOCKED.md`  \n**Purpose:** Resolve selected items in the v2.1 Unresolved Rules Register and clarify independent manifestations and secondary consciousnesses.  \n**Change control:** This is the player-approved v2.2 version. It supersedes v2.1 as the active Galakrond rules version only for the clauses explicitly resolved in this document. `Galakrond_Rules_v2.1_LOCKED.md` remains unchanged and preserved as the prior version. G-10 option C remains recorded but textually unresolved; the v2.1 G-10 handling is carried forward without alteration until that specific item receives a later approved amendment.\n\n---\n\n# 0. Change-Control Statement\n\n1. `Galakrond_Rules_v2.1_LOCKED.md` remains unchanged and fully authoritative during this Draft.\n2. This proposal is an additive clarification package. It preserves every v2.1 rule unless a future approved version explicitly identifies a replacement.\n3. The clauses in this v2.2 document are active as approved, except the explicitly unresolved G-10 option-C wording, for which the unchanged v2.1 handling continues to apply.\n4. Where this v2.2 document expressly resolves an item differently from the previously undefined v2.1 handling, this approved v2.2 clause governs. Otherwise, v2.1 remains the controlling prior rule.\n5. This Draft does not create new numerical values except the explicit maximum of two independent bodies selected under G-13. It does not invent a summoning duration, cooldown, activation cost, recovery time, range, synchronization interval, or consciousness-development schedule <script type="application/json" id="rulesdata">{"core": [{"name": "Douluo_Another_Fate_Master_Rulebook_Consolidated_v0.4", "text": "# Douluo Dalu: Another Fate — Master Rulebook\n## Nightmare Edition | Consolidated Working Release v0.4\n\n**Status:** CONSOLIDATED REFERENCE — updated 2026-11-15 to match Authoritative Rule Register v0.3; not a replacement for source documents  \n**Supersedes:** Master Rulebook v0.3 (preserved unchanged), v0.2, v0.1  \n**Project state:** Rules consolidation and audit; actual game and character creation have not started  \n**Format:** E2 — Master Rulebook + Appendices  \n**Rule authority:** Existing LOCKED source documents remain authoritative within their scopes.\n\n> This document is an index and integrated reference. If a summary here conflicts with a source document, the source document wins. This consolidation does not silently amend any LOCKED rule.\n\n## 1. Core Operating Principles\n\n- Lethality: every risky action can have severe consequences, including death; Full Death invokes Full Reset. This applies in every difficulty mode.\n- Difficulty mode (Easy / Normal / Hard / Nightmare) is chosen by the player at the start of each Run and sets non-player attribute multipliers and extra-action chances (Difficulty Mode Framework v1.0).\n- Natural D100 results: 01–05 always fail and 96–100 always succeed on attack hit, resistance, and general checks (D100 Natural Result Rule v1.0).\n- One in-world day is 24 hours. Every 30 days, a special event is rolled with a 50/50 good/bad outcome.\n- Risky or uncertain actions use D100 (01–100). Show the roll, DC, modifiers, formula, and outcome.\n- Certain actions do not require a roll. Impossible actions cannot be forced to succeed by rolling.\n- Combat uses D100 for checks and D&D dice for damage.\n- NPCs have independent goals and may lie, betray, fight, or kill the player.\n- NPCs and gods are not omniscient; they need a plausible information channel.\n- The player knows Douluo Dalu canon parts 1–5; NPCs do not automatically know future events or inaccessible information.\n- Canon history is the starting point and can change through player actions.\n- DM Wishes: 3 per Run; Full Reset restores the count to 3.\n- The Game Master Ledger is the authoritative record of state, time/location, events, NPC relations, rolls, quests/rewards, plot changes, Wishes, and rule versions.\n\n## 2. Rule Precedence\n\n1. Approved Core Rules.\n2. Approved category-specific rules.\n3. Galakrond / Ddraig special rules within their documented scopes; they do not overwrite Core Rules.\n4. Adapted D&D rules.\n5. DM ruling for matters not specified by higher authority.\n\nThe DM may propose amendments but cannot change a LOCKED rule without explicit player approval and a separately versioned revision.\n\n## 3. Official Category Index — Original Numbering\n\nThere are 30 active LOCKED categories across original slots 01–31. Category 17 was cancelled and is skipped; it is not an active category.\n\n| No. | Category | Status |\n|---:|---|---|\n| 01 | Core Rules | LOCKED |\n| 02 | Character System | LOCKED |\n| 03 | Soul Power System | LOCKED |\n| 04 | Martial Soul System | LOCKED |\n| 05 | Soul Ring System | LOCKED |\n| 06 | Soul Bone System | LOCKED |\n| 07 | Equipment System | LOCKED |\n| 08 | Inventory & Storage System | LOCKED |\n| 09 | Combat System | LOCKED; supplemented by Combat Formula v1.0 |\n| 10 | Status Effects & Conditions | LOCKED; supplemented by Status/Death v1.0 |\n| 11 | Skill & Ability System | LOCKED; supplemented by Skill Proficiency v1.0 |\n| 12 | Quest & Mission System | LOCKED |\n| 13 | NPC & Relationship System | LOCKED |\n| 14 | World & Exploration System | LOCKED |\n| 15 | Faction & Organization System | LOCKED |\n| 16 | Economy & Trading System | LOCKED |\n| 17 | Crafting & Production System | CANCELLED / SKIPPED |\n| 18 | Information & Knowledge System | LOCKED |\n| 19 | Event & World Simulation System | LOCKED |\n| 20 | Death, Resurrection & Rebirth System | LOCKED; supplemented by Death/Full Reset v1.0 |\n| 21 | Divine System | LOCKED |\n| 22 | Reputation & Karma System | LOCKED |\n| 23 | Law, Crime & Justice System | LOCKED |\n| 24 | Dialogue & Social Interaction System | LOCKED |\n| 25 | Achievement & Milestone System | LOCKED |\n| 26 | Survival & Environmental System | LOCKED |\n| 27 | Travel & Transportation System | LOCKED |\n| 28 | Time & Calendar System | LOCKED |\n| 29 | Privacy, Information Access & Surveillance System | LOCKED |\n| 30 | Game Interface & System Notification | LOCKED |\n| 31 | Special Rules & Exceptions System | LOCKED |\n\nThe names and numbering above follow Rulebook Audit v1 and the original v0.1 category index. Do not substitute the renumbered categories in Working Consolidation v0.2.\n\n## 4. Confirmed Supplement Register\n\n| Source document | Version / status | Scope |\n|---|---|---|\n| Random Starting Attribute Generation | v1.0 LOCKED | Initial attributes and starting current HP/SP |\n| Human Soul Rank Framework | v1.1 LOCKED | H1–H10 and Divine progression distinctions |\n| H-16 Attribute & Combat Rank | v1.1 LOCKED | Eight attributes, effective attribute order, Rank Baseline, archetypes, OCI |\n| Character & Entity Classification | v1.1 LOCKED | Entity identity, rank namespaces, threat and combat-rank distinctions |\n| Soul Beast Rank Framework | v1.1 LOCKED | SB1–SB7, DS-Rank, bloodline rank/purity, IQ rank |\n| Soul Beast Rank Baseline Equivalence | v1.0 LOCKED | Soul Beast age → H-16 Rank Baseline row for attribute generation |\n| Human Transformation Framework | v1.1 LOCKED | Nonhuman-to-human transformation |\n| Non-Soul Human Classification | v1.1 LOCKED | Civilian, social, professional, military, command tracks |\n| Combat Formula Framework | v1.0 LOCKED | Derived stats, checks, damage, defense, initiative |\n| D100 Natural Result Rule | v1.0 LOCKED | 01–05 fail / 96–100 succeed |\n| Difficulty Mode Framework | v1.0 LOCKED | Easy / Normal / Hard / Nightmare |\n| Basic Unarmed Punch Damage Rule | v1.0 approved | Ordinary punch = Current STR × 0.5 raw physical |\n| HP/SP Starting Base Addendum | v1.0 LOCKED | Player character Max HP/SP base terms |\n| HP/SP Growth Bonus | v1.0 LOCKED | HPGB / SPGB formulas |\n| EXP Requirement Framework | v1.1 LOCKED | Four EXP pools, per-level requirement, gates, overflow |\n| Phase 1 Consolidated Rules | v1.0 LOCKED | Skill Capacity, Combat/Knowledge EXP, 2-hour cultivation, inventory capacity, combat skill framework |\n| Soul Ring & Absorption Rules | v1.1 LOCKED | Ring absorption; 2 skills at 100,000+ years |\n| Soul Ring Skill SP Cost and Cooldown Rule | v1.0 approved | SP cost = 2 × ring number + 3; cooldown by ring age |\n| Soul Bone Fusion Rules | v1.0 LOCKED | Fusion eligibility, checks, duration, failure, removal, ledger |\n| Soul Ring & Soul Bone Level Progression Bonus | v1.1 LOCKED | Level progression bonuses |\n| Permanent Attribute Acquisition | v1.1 LOCKED | Permanent bonuses and distribution |\n| Herb and Plant Permanent Benefit Framework | v1.0 LOCKED | Permanent benefits from herbs and plants |\n| Recovery / Abnormal Status / Death / Skill Proficiency | v1.0 LOCKED | Recovery, status, rescue, Full Death, proficiency |\n| Unique System Framework | v2.1 LOCKED | System functions, Shop Pts, Shop, random supply, Custom Order, Domains, Full Reset persistence |\n| Galakrond Rules | v2.1 LOCKED + v2.2 LOCKED | Martial Soul 1; v2.2 governs the clauses it resolves |\n| Galakrond Martial Soul Possession Temporary Attribute Rules | v1.0 approved | Possession bonuses and temporary Dragon Devour growth |\n| Ddraig Boosted Gear Rules | v2.1 LOCKED | Martial Soul 2 / Sacred Gear |\n| Shrek Seven Devils Anti-Protagonist Personality Framework | v1.0 LOCKED | NPC personality for the protagonist group |\n| Opponent Full Disclosure Policy | v1.0 LOCKED | Opponent status sheet before combat |\n| Character Attribute/Skill Auto-Record Policy | v1.0 approved | Immediate recording of attribute and skill changes |\n| Harmonization Addendum | v1.0 LOCKED | How to read conflicting clauses (MP = SP, non-player HP/SP, training table, Boost order) |\n| Operational Appendices | v1.0 | Character Window, Master Ledger, desk audit |\n\nReference data (not rules): Important Characters and Opponents Database v1.0 DRAFT; campaign event records dated 2026-11-14.\n\n## 5. Progression and Attribute Reference\n\n### 5.1 Four independent EXP pools\n\nTraining EXP, Soul Power EXP, Combat EXP, and Knowledge EXP are separate pools. Do not merge, exchange, or treat them as automatic Skill Proficiency.\n\nEXP requirement for current Level L:\n\n`EXP(L) = 100 + 20 × (L − 1) + 100 × floor((L − 1) / 10)`\n\nSoul Power has a Soul Ring breakthrough gate at each 10-level boundary. The next ring, successful absorption, and sufficient EXP are distinct requirements. Overflow is retained when a gate blocks progression. Soul Power Level +1 grants 2 Attribute Points. Training / Combat / Knowledge Level are progression measures and are not Human Soul Rank, Combat Rank, Professional Rank, or Skill Proficiency.\n\n### 5.2 Human Soul Rank\n\nH1 Level 1–10; H2 11–20; H3 21–30; H4 31–40; H5 41–50; H6 51–60; H7 61–70; H8 71–80; H9 81–90; H10 91–100. The upper endpoint of H1–H9 is a gate and does not automatically promote the character. H10 sub-ranks: Standard 91–94; Super 95–98; Limit 99; Level 100 remains H10 without an assigned sub-rank. There is no Level 101 under the current framework.\n\nHuman Divine Progression is separate: D0 Candidate, D1 Quasi-God, D2 True God. Level 100 alone does not grant D0 without a genuine path toward Godhood.\n\n### 5.3 Attributes\n\nSTR, AGI, VIT, END, INT, WIS, PER, WILL. Effective Attribute:\n\n`(Base Attribute + Permanent Bonus) × Temporary Multiplier + Temporary Flat Bonus`\n\nStandard attribute range is 1–100. Values above 100 require a documented source/formula and do not remove source-specific caps.\n\n## 6. Combat and Survival Reference\n\nCombat uses D100 checks and D&D damage dice. The Combat Formula source governs derived values, hit/defense, damage reduction, critical hits, resistance, and initiative. HP ≤ 0 means Near Death, not automatic Full Death.\n\nPlayer character Max HP/SP use the HP/SP Starting Base Addendum and Growth Bonus. Increasing Max HP/SP does not automatically restore Current HP/SP.\n\nRecovery v1.0: 15 minutes restores 2% Max HP / 3% Max SP; 1 hour 8% / 12%; 8 hours 40% / 60%; 24 hours 100% / 100%. These are total rates for the selected continuous rest duration, not cumulative entries. Safe rest receives full rate; uninterrupted unsafe rest receives half rate; interruption ends the rest; unconsciousness is not natural rest. Recovery does not automatically heal injuries or remove statuses.\n\nDeath v1.0: General Near Death rescue window 10 minutes; Severe Injury 5 minutes; Critical Injury 3 minutes; Fatal Injury 1 minute. Rescue DCs are 60 / 80 / 100 / 120 respectively. Expiry requires an assessment of actual condition; HP 0 alone is not Full Death. Confirmed Full Death invokes Full Reset. The Unique System's specified System data (including Shop Pts) persists; character progression, attributes, Soul Rings/Bones, purchased Domains, equipment, money/assets, relationships, and current Run world state reset as specified by Unique System v2.1 and Core Death rules.\n\n## 7. Soul Ring and Soul Bone Reference\n\nSoul Ring absorption uses Soul Ring & Absorption v1.0. Soul Bone fusion uses Soul Bone Fusion v1.0. Do not replace their DCs, check counts, stage modifiers, durations, interruption rules, failure consequences, or reward conditions with estimates.\n\nSoul Bone Fusion v1.0 requires assessment of Body, Soul, Soul Power Capacity, Control, Position, Element, and Special Compatibility. It uses age-based Base DC, one overall Compatibility grade, Condition Modifier, and age-based check counts. A failed main check ends fusion immediately; no Partial Success. Failed fusion grants no permanent attribute or level bonus. The Soul Bone is not automatically destroyed. Controlled Removal only.\n\n## 8. Special Systems\n\n- Galakrond v2.1 with v2.2 governs Martial Soul 1. \"MP\" in these documents means SP (Harmonization Addendum H-07). G-10 remains unresolved; do not invent missing numerical values.\n- Ddraig v2.1 governs Boost stages, load, duration, overload, mastery, and special forms.\n- Unique System v2.1 governs the System, its Shop, and persistence across Full Reset; it is not omniscient. System-supplied Soul Rings and Soul Bones succeed automatically for the owner.\n- Special rules require a documented source, conditions, limits, and ledger entry. Any new exception requires approval.\n\n## 9. Character Interface and Ledger Architecture\n\nThe user selected B3 Hybrid Character Window and C3 Hybrid Game Master Ledger.\n\n### 9.1 Character Window — player-facing view\n\n**Overview panel**\n- Identity, aliases, species, age, origin, current location and in-world time.\n- Current / Highest Rank, applicable power-system ranks, Overall Combat Rank and Threat Level where assessed.\n- Current HP / Max HP; Current SP / Max SP; active critical condition and visible status/injury alerts.\n- Eight Primary Attributes and effective values.\n- Four EXP pools and their current Level tracks.\n- Martial Souls / Sacred Gear, equipped Soul Rings, standard and External Soul Bones.\n- Active skills, Proficiency, equipment, currency, and inventory summary.\n- Visible quests, achievements, relationships known to the character, and notifications.\n\n**Detail panels**\n1. Attributes & derived combat values.\n2. Soul Power & cultivation.\n3. Martial Souls, Soul Rings, Soul Bones and fusion history.\n4. Skills, abilities and Proficiency.\n5. Equipment, inventory and storage.\n6. Status, injuries, recovery and rescue timer.\n7. EXP, Level, ranks and milestones.\n8. Quests, achievements, relationships and known world information.\n9. Special Systems: Galakrond, Ddraig, Unique System, divine tracks.\n10. History and notifications.\n\nInformation must be filtered by what the character can know. Hidden NPC/world facts and DM-only rolls do not appear in the player-facing window unless revealed by an in-world information channel. This design operationalizes the existing category; it does not create new game statistics.\n\n### 9.2 Master Ledger — authoritative state\n\nMaintain one Master Ledger record with linked sub-ledgers:\n- Character State & Attribute History\n- Time / Calendar / Location / Travel\n- EXP / Level / Rank / Attribute Point History\n- Combat / D100 / DC / Modifiers / Damage / Outcome\n- Skill / Proficiency / STP / Evaluation\n- Soul Ring / Hunt / Absorption\n- Soul Bone / Fusion / Removal / Evolution\n- Permanent Attribute Source & Distribution\n- HP / SP / Recovery / Status / Injury / Death / Rescue\n- Equipment / Inventory / Currency / Assets\n- NPC / Relationship / Knowledge Access / Faction\n- Quest / Achievement / Reward\n- World Event / Timeline / Divine Intervention\n- Galakrond / Ddraig / Unique System\n- DM Wishes / Full Reset / Persistent System Data\n- Rule Version / Approval / Change History\n\nEvery consequential change must record: event ID, in-world timestamp, actor/source, before state, action/check, roll, DC, modifiers, formula, outcome, after state, source rule/version, and knowledge visibility. Unknown or unverified data must be marked; do not infer missing facts.\n\n### 9.3 Synchronization rules\n\n- Master Ledger is the source of truth; Character Window is a filtered view.\n- Sub-ledgers link to a stable character/entity ID and event ID.\n- Full Reset creates a new Run state and preserves only data explicitly designated persistent by the Unique System.\n- Historical data must not overwrite the new Run.\n- Record each roll once; display the same result in the relevant player-facing notification and audit history.\n- No silent correction of past records; corrections are appended with reason and reference.\n\n## 10. Nightmare Stress Test — Desk Audit\n\n**Test type:** rule-flow and arithmetic consistency review, not a live character combat simulation. No actual character, dice result, or in-game event is fabricated.\n\n| Test | Expected rule path | Audit result |\n|---|---|---|\n| Training and Soul Power EXP | Separate pools; requirement formula; ring gate blocks progression and retains overflow | PASS — no cross-pool conversion |\n| Soul Ring absorption | Age Base DC + Compatibility + Special modifier, clamp; age-based checks; failure stops process | PASS — procedure defined in source |\n| Soul Bone fusion | Seven compatibility dimensions; one overall grade; age DC/check count; failed main check terminates | PASS — no Partial Success |\n| Permanent bonuses | Source eligibility → player distribution within eligible group → PA ledger → H-16 effective attribute | PASS — v1.1 procedure unified |\n| External Soul Bone attacks | Independent D100 per installed piece; 01–20 trigger; obey range/LOS/accuracy; no extra Action | PASS — independent rolls, not guaranteed average |\n| Ddraig Boost | Multiplier applies to all eight primary attributes; derived stats recalculated afterward; load/overload checks | PASS — use v2.1 only |\n| Galakrond | Apply v2.1; unresolved register values remain unknown | CONDITIONAL PASS — no invented values |\n| Recovery and status | Recovery rate uses Max HP/SP; status expiry does not erase physical injury | PASS — no automatic injury healing |\n| Near Death and rescue | HP ≤ 0 Near Death; rescue timer and DC; timer expiry is not automatic Full Death | PASS — actual condition assessment required |\n| Full Death / Full Reset | Confirm Full Death; reset character/world state; preserve only Unique System persistent data | PASS — persistence boundary documented |\n| Character Window privacy | Show character-known information only | PASS — filtered view |\n| Ledger integrity | Master record + linked sub-ledgers; Run separation; append-only corrections | PASS — architecture defined |\n\n### Stress-test blockers / conditions\n\n1. A full numerical combat simulation requires a generated character and a specified encounter. Neither has been created because the game has not started.\n2. Galakrond G-10 remains gated until its authoritative wording is documented.\n3. Special Soul Bone, Divine, transformed, conscious, multi-element, and other exceptional absorptions/fusions require their specific documented rules; do not extrapolate the standard procedure beyond scope.\n4. Category 17 remains cancelled. Do not reintroduce it as an active crafting system.\n5. Character Window and Ledger are operational layouts derived from the existing categories and sources; they are not claims that a previously missing source template was found.\n\n## 11. Appendices\n\n- Appendix A — Permanent Attribute Acquisition Framework v1.1 LOCKED (separate file).\n- Appendix B — Character Window Hybrid specification (Section 9.1).\n- Appendix C — Game Master Ledger Hybrid specification (Sections 9.2–9.3).\n- Appendix D — Nightmare Stress Test (Section 10).\n- Appendix E — Source Register (Section 4 and relevant source documents).\n\n## 12. Readiness Verdict\n\n**Rules consolidation:** ready as a working integrated reference.  \n**Permanent Attribute Acquisition:** approved and locked as v1.1 by the user's explicit A1 selection.  \n**Character Window / Master Ledger:** architecture specified; can be used as the operational format without changing game mechanics.  \n**Nightmare Stress Test:** desk audit completed; no fabricated dice rolls or character outcomes.  \n**Full live-play readiness:** conditional. Before actual play, the DM must consult the authoritative special-rule sources for any applicable exception and must not fill unresolved Galakrond or special-absorption values by guesswork. A real combat stress test remains pending until there is an actual character and encounter.\n\n**No character has been created and no game has been started by this consolidation.**\n\n## 13. v0.4 Change Log\n\n- Source Register rebuilt to match Authoritative Rule Register v0.3 (adds 14 documents that v0.3 did not list; updates Unique System to v2.1 and Soul Ring & Absorption to v1.1; Galakrond now v2.1 + v2.2).\n- Core principles now state difficulty modes and the natural D100 result rule.\n- No mechanic is defined here; every rule lives in its source document. Open items: Galakrond G-10 wording; the player character sheet and Ledger for Ta'ao."}, {"name": "Harmonization_Addendum_v1.0_LOCKED", "text": "# Douluo Dalu: Another Fate — Harmonization Addendum v1.0\n\n**สถานะ:** LOCKED — ผู้เล่นอนุมัติเมื่อ 2026-11-15 (\"LOCKED ทั้งหมด\") — จัดทำตามคำสั่งผู้เล่นให้แก้ข้อที่ไม่สมเหตุสมผลหรือขัดแย้งตามสมควร  \n**หลักการ:** ไม่เขียนทับเอกสาร LOCKED ใด เอกสารนี้บอกว่าเมื่อข้อความสองแห่งขัดกันให้อ่านอย่างไร เอกสารต้นทางทั้งหมดเก็บไว้ตามเดิม\n\n## A. แก้การอ้างอิงที่ล้าสมัย (ไม่เปลี่ยนกลไก)\n\n| รหัส | ที่ไหน | ให้อ่านว่า |\n|---|---|---|\n| H-01 | Master Rulebook v0.3 ข้อ 4, ข้อ 8 อ้าง \"Galakrond v2.1\" | Galakrond v2.1 LOCKED ร่วมกับ v2.2 LOCKED (v2.2 ชนะในข้อที่ v2.2 แก้) |\n| H-02 | Galakrond Possession Temporary Attribute Rules v1.0 ข้อ 6 เรียก v2.2 ว่า \"pending DRAFT\" | v2.2 เป็น LOCKED แล้ว |\n| H-03 | ไฟล์ Galakrond v2.2 LOCKED บรรทัด Document เขียน `..._v2.2_DRAFT.md` | ชื่อเอกสารคือ `Galakrond_Rules_v2.2_LOCKED.md` |\n| H-04 | Soul Ring & Soul Bone Level Progression Bonus v1.1 อ้าง Permanent Attribute Acquisition v1.0 | Permanent Attribute Acquisition v1.1 LOCKED |\n| H-05 | Master Rulebook v0.3 Source Register ไม่มีเอกสารที่อนุมัติแล้ว | เพิ่ม: Herb and Plant Permanent Benefit v1.0, Shrek Seven Devils Personality v1.0, Opponent Full Disclosure v1.0, Galakrond Possession Temporary Attribute v1.0, Soul Ring Skill SP Cost & Cooldown v1.0, Basic Unarmed Punch v1.0, Auto-Record Policy v1.0, Galakrond v2.2 |\n| H-06 | Master Working Consolidation v0.2, Master v0.1, Audit Round 1, Galakrond ฉบับแรก/v2.0, Ddraig_Boost_Rules ฉบับแรก | เลิกใช้ เก็บเป็นประวัติเท่านั้น |\n\n## B. ข้อตัดสินที่เติมช่องว่าง (เลือกทางที่กระทบกฎเดิมน้อยที่สุด)\n\n| รหัส | ปัญหา | ข้อตัดสิน | เหตุผล |\n|---|---|---|---|\n| H-07 | Galakrond/Ddraig ใช้คำว่า MP แต่ระบบตัวละครมีแค่ SP | **MP = SP (Soul Power)** ทุกที่ \"Max MP\" = Max SP | ระบบตัวละครมีทรัพยากรเดียว ไม่มีเอกสารใดนิยาม MP แยก |\n| H-08 | Dragon Devour เพิ่มค่าสถานะ 2 แบบ | ใช้ทั้งคู่ แยกบัญชีกัน: วงที่ 4 = Permanent Bonus (+2 ครั้งเดียวต่อเป้าหมาย); Possession = Temporary Flat Bonus (+1 ต่อการกิน หายเมื่อจบ Possession) | ตรงกับ H-16 ที่แยก Permanent กับ Temporary และตรงกับบันทึกเหตุการณ์ 14 พ.ย. |\n| H-09 | HP/SP ของ NPC และ Soul Beast | ใช้สูตร Combat Formula v1.0: HP = VIT×10 + END×5 + โบนัสที่มีที่มา; SP = END×10 + VIT×3 + โบนัสที่มีที่มา ไม่มีฐาน 100/50 (Addendum ใช้กับตัวละครผู้เล่นเท่านั้น) ค่าที่บันทึกในเหตุการณ์ที่จบไปแล้วไม่แก้ย้อนหลัง | Addendum ระบุขอบเขตเฉพาะผู้เล่น; Auto-Record ห้ามแก้อดีตเงียบ ๆ |\n| H-10 | ตารางฝึก 15 นาที/30 นาที/1 ชม. ไม่มีเอกสารต้นทางในชุดไฟล์ | ใช้ค่าที่ Audit Round 1 ระบุว่า \"confirmed\": 15 นาที = Training 2 / Soul Power 0–1; 30 นาที = 5 / 1–2; 1 ชม. = 10 / 2–5; 2 ชม. = 30 / 6–12 (Phase 1) | เป็นค่าที่บันทึกว่ายืนยันแล้ว |\n| H-11 | Character & Entity Classification v1.1 LOCKED ใช้ DS0–DS3 ที่นิยามในเอกสารยังไม่ล็อก | ใช้ Soul Beast Rank v1.1, Human Transformation v1.1, Non-Soul Human v1.1 เป็น \"working reference\" สำหรับชื่อเรียกและการจัดประเภทเท่านั้น จนกว่าจะล็อก | เอกสาร LOCKED พึ่งคำศัพท์เหล่านี้อยู่แล้ว |\n| H-12 | ลำดับคำนวณเมื่อ Boost | Effective Attribute = (Base + Permanent) × Boost + Temporary Flat แล้วจึงคำนวณค่ารอง (ATK, ACC, EVA ฯลฯ) จากค่าที่ได้ ไม่คูณซ้ำ | ตาม H-16 v1.1 และ Ddraig v2.1 |\n| H-13 | วงแหวน 100,000 ปีขึ้นไป | 2 ทักษะ ทุกแหล่งที่มา | คำสั่งผู้เล่น; ดู Soul Ring & Absorption Rules v1.1 |\n| H-14 | Unique System | ใช้ v2.1 LOCKED; v2.0 DRAFT เลิกใช้; v1.0 เก็บเป็นประวัติ | คำสั่งผู้เล่น |\n\n## C. ยังแก้ไม่ได้ (ต้องมีข้อมูลจากผู้เล่น)\n\n- **Galakrond G-10** (ค่ากดทับมิติก่อนวงที่ 6): ตัวเลือก C ไม่มีข้อความในเอกสารใด ใช้ v2.1 ต่อไป (ไม่มีเปอร์เซ็นต์กลาง)\n- **ตัวละคร Ta'ao**: ไม่มีใบตัวละครและ Ledger ในไฟล์ ห้ามเดาค่า ต้องแนบ หรือสั่งเริ่มตัวละครใหม่\n- **SP ปัจจุบันของ Ta'ao (45)**: มาจากข้อสันนิษฐานในบันทึกเหตุการณ์ รอ Ledger ยืนยัน"}, {"name": "Difficulty_Mode_Framework_v1.0_LOCKED", "text": "# Difficulty Mode Framework v1.0\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** LOCKED — ค่าของแต่ละโหมดเป็นคำสั่งผู้เล่น 2026-11-15; ข้อปฏิบัติที่เหลือจัดทำตามที่ผู้เล่นมอบให้ \"จัดการตามสมควร\" (ระบุไว้ในข้อ 7)  \n**Version:** 1.0  \n**ขอบเขต:** ความแข็งแกร่งของตัวละครที่ไม่ใช่ผู้เล่น ไม่แก้สูตรใดใน Combat Formula Framework v1.0\n\n## 1. โหมดความยาก (คำสั่งผู้เล่น)\n\n| โหมด | ค่าสถานะของตัวละครอื่น | โอกาสได้ Action เพิ่มใน 1 ตา |\n|---|---:|---:|\n| ง่าย (Easy) | ไม่เปลี่ยน (×1.0) | ไม่มี |\n| ปกติ (Normal) | +20% (×1.2) | ไม่มี |\n| ยาก (Hard) | +40% (×1.4) | 20% |\n| ฝันร้าย (Nightmare) | +100% (×2.0) | 30% |\n\n## 2. ใช้กับใคร\n- ใช้กับตัวละครที่ไม่ใช่ผู้เล่นทุกตัวที่เข้าร่วมการต่อสู้หรือการตรวจ: มนุษย์ สัตว์วิญญาณ เทพ และสิ่งมีชีวิตอื่น ทั้งฝ่ายศัตรู ฝ่ายกลาง และพันธมิตร\n- ไม่ใช้กับตัวละครผู้เล่น ร่างของ Galakrond ร่างของ Ddraig และสิ่งที่ผู้เล่นอัญเชิญหรือควบคุมด้วยพลังของตนเอง\n\n## 3. ตัวคูณค่าสถานะ\n1. คูณที่ค่าสถานะหลักทั้ง 8 ค่า: `ค่าฐานตามโหมด = floor(ค่าฐาน × ตัวคูณโหมด)` ขั้นต่ำ 1\n2. จากนั้นใช้ลำดับ H-16 ตามเดิม (โบนัสถาวร ตัวคูณชั่วคราว โบนัสชั่วคราว) แล้วคำนวณค่ารอง HP/SP/ATK/DEF ฯลฯ จากค่าที่ได้ ไม่คูณค่ารองซ้ำ\n3. ค่าที่เกิน 100 จากตัวคูณนี้ถือว่ามีแหล่งที่มารองรับตาม H-16 ข้อ 1\n4. ใบสถานะศัตรู (Opponent Full Disclosure) ต้องแสดงทั้งค่าฐานและค่าหลังคูณ พร้อมชื่อโหมด\n\n## 4. Action เพิ่ม\n1. เมื่อเริ่มตาของตัวละครที่ไม่ใช่ผู้เล่นในการต่อสู้ DM ทอย D100 เปิดเผย: โหมดยาก ผล 01–20, โหมดฝันร้าย ผล 01–30 ได้ **Action เพิ่ม 1 ครั้ง** ในตานั้น\n2. ได้เพิ่มเฉพาะ Action ไม่ได้ Movement หรือ Reaction เพิ่ม และได้ไม่เกิน 1 ครั้งต่อตา\n3. Action เพิ่มใช้กฎเดิมทุกอย่าง (ค่า SP, Cooldown, ระยะ) ทักษะที่ติด Cooldown ยังใช้ไม่ได้\n4. ตัวละครที่ทำ Action ไม่ได้เพราะสถานะผิดปกติ ไม่ทอยและไม่ได้ Action เพิ่ม\n\n## 5. สิ่งที่โหมดไม่เปลี่ยน\n- กฎความตายทุกโหมดเหมือนกัน: HP 0 = Near Death, ตายสมบูรณ์ = Full Reset, DM Wishes 3 ครั้งต่อรอบ\n- DC, สูตรดาเมจ, EXP ที่ได้, Shop Pts ตามตาราง VG, ราคาร้าน, ของที่ได้ และกฎดูดซับ/หลอม ไม่เปลี่ยนตามโหมด\n- ชื่อเกม \"Nightmare Edition\" เป็นชื่อฉบับ ไม่ได้บังคับโหมดฝันร้าย\n\n## 6. การเลือกและเปลี่ยนโหมด\n1. ผู้เล่นเลือกโหมดตอนเริ่มรอบ (Run) ก่อนสร้างตัวละคร ถ้ายังไม่เลือก DM ต้องถาม ห้ามเลือกแทน\n2. เปลี่ยนโหมดกลางรอบได้เมื่อผู้เล่นสั่งชัดเจนเท่านั้น มีผลตั้งแต่การต่อสู้ครั้งถัดไป ไม่เปลี่ยนกลางการต่อสู้ และต้องบันทึกใน Ledger\n3. บันทึกเหตุการณ์ที่จบไปแล้วไม่คำนวณย้อนหลัง\n\n## 7. ข้อที่ผู้จัดทำกำหนดเอง (ไม่ใช่คำสั่งผู้เล่นโดยตรง)\nข้อ 2 (รวมพันธมิตร, ยกเว้นร่างของ Galakrond/Ddraig), ข้อ 3 (คูณที่ค่าฐานแล้วปัดลง), ข้อ 4.2–4.4, ข้อ 5 และข้อ 6 หากไม่ตรงเจตนา ให้ออกเวอร์ชันใหม่"}, {"name": "D100_Natural_Result_Rule_v1.0_LOCKED", "text": "# D100 Natural Result Rule v1.0\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** LOCKED — จัดทำ 2026-11-15 ตามที่ผู้เล่นมอบให้จัดการข้อเสนอแนะที่เหลือตามสมควร  \n**ที่มา:** ออกแบบเพื่อเกม (ไม่มีในเนื้อเรื่อง)  \n**เหตุผล:** เมื่อ Boost สูง ค่า ACC/EVA ต่างกันเกิน 100 ทำให้ผลทอย D100 ไม่มีความหมาย กฎนี้ทำให้ลูกเต๋ายังมีผลเสมอ โดยไม่แก้สูตรใดใน Combat Formula Framework v1.0\n\n## 1. กฎ\nผลทอย D100 ดิบ (ก่อนบวกค่าใด ๆ) ของฝ่ายที่ลงมือ:\n- **01–05 = ล้มเหลวเสมอ**\n- **96–100 = สำเร็จเสมอ**\n- 06–95 = ใช้สูตรตามปกติ\n\n## 2. ใช้กับ\n1. Attack Hit Check (Combat Formula ข้อ 5): ดูผลทอยของผู้โจมตีเท่านั้น 01–05 พลาด, 96–100 โดน ผลทอยของผู้ป้องกันใช้คำนวณตามปกติ\n2. Resistance Check (ข้อ 8) และ General Check (ข้อ 11): ดูผลทอยของผู้ทำการตรวจ\n\n## 3. ไม่ใช้กับ\n- การกระทำที่ DM ประกาศว่าเป็นไปไม่ได้ (ไม่มีการทอย ตามกฎเดิม) และการกระทำที่สำเร็จแน่นอน (ไม่ต้องทอย)\n- การโจมตีที่ \"หลบไม่ได้\" ตามเงื่อนไขของทักษะ\n- Critical Check (ใช้โอกาสคริติคอลตามเดิม), Initiative, การทอยดาเมจ\n- การดูดซับวงแหวน การหลอมกระดูก Overload Check และ Mastery Test ของ Ddraig, การช่วยชีวิต Near Death: ใช้ขั้นตอนในเอกสารของตนเองเท่านั้น\n\n## 4. การแสดงผล\nเมื่อผลเข้ากฎนี้ ต้องแจ้งว่า \"ผลธรรมชาติ 01–05\" หรือ \"ผลธรรมชาติ 96–100\" พร้อมสูตรปกติที่ควรจะได้ และบันทึกลง Ledger"}, {"name": "Basic_Unarmed_Punch_Damage_Rule_v1.0", "text": "# Douluo Dalu: Another Fate — Basic Unarmed Punch Damage Rule v1.0\n\n**Status:** Player-approved rule\n**Scope:** Ordinary unarmed punches only. This rule does not grant or replace a Martial Soul skill, Soul Ring skill, or Ddraig Solid Impact.\n\n## Damage formula\n\n- Each 1 point of current STR contributes **0.5 Raw Physical Damage** to an ordinary unarmed punch.\n- **Raw Punch Damage = Current STR × 0.5**.\n- Use Current STR at the moment of impact, including active attribute multipliers such as Ddraig Boost and applicable temporary bonuses.\n- This is flat raw damage; it does not require a damage-die roll.\n- Resolve a successful hit using the global Combat Formula Framework: apply the target's Physical DEF through the standard damage-reduction formula, unless a specific rule states otherwise.\n- The ordinary punch does not bypass DEF/armor and does not inherit Solid Impact's penetration effect.\n- Attack hit checks and critical-hit rules remain governed by the global Combat Formula Framework.\n\n## Example\n\nAt Current STR 1, an ordinary punch deals 0.5 Raw Physical Damage. At Current STR 100, it deals 50 Raw Physical Damage before Physical damage reduction.\n\n## Authority\n\nThis is a player-approved ordinary unarmed attack rule. It does not modify the locked global Combat Formula Framework or Ddraig rules; it supplies the previously undefined flat damage value for a basic punch."}, {"name": "Soul_Ring_Skill_SP_Cost_and_Cooldown_Rule_v1.0", "text": "# Soul Ring Skill SP Cost and Cooldown Rule v1.0\n\n**Game:** Douluo Dalu: Another Fate — Nightmare Edition  \n**Status:** Player-approved rule; applies prospectively to Soul Ring skills unless a higher-priority specific rule explicitly overrides it.\n\n## 1. Soul Power (SP) Cost by Soul Ring Number\n\nActivating a skill granted by a Soul Ring consumes SP according to the ring's sequence number:\n\n| Soul Ring | SP cost per skill activation |\n|---:|---:|\n| 1st | 5 SP |\n| 2nd | 7 SP |\n| 3rd | 9 SP |\n| 4th | 11 SP |\n| 5th | 13 SP |\n| 6th | 15 SP |\n| 7th | 17 SP |\n| 8th | 19 SP |\n| 9th | 21 SP |\n\nFormula: **SP Cost = 2 × Soul Ring Number + 3**.\n\nThe cost is paid for each activation of a Soul Ring skill. If a skill has a separately approved cost or exception, that specific rule takes precedence for that skill.\n\n## 2. Cooldown by Soul Ring Age\n\nA Soul Ring skill's base cooldown is determined by the cultivation age of the Soul Ring that grants that skill:\n\n| Soul Ring cultivation age | Cooldown after use |\n|---:|---:|\n| 10–99 years | 0 turns (no cooldown) |\n| 100–999 years | 1 turn |\n| 1,000–9,999 years | 2 turns |\n| 10,000–99,999 years | 3 turns |\n| 100,000–999,999 years | 4 turns |\n| 1,000,000–9,999,999 years | 5 turns |\n\nThe progression continues by adding one cooldown turn for each tenfold age band above the 10–99-year band.\n\nCooldown is measured in combat turns. A skill cannot be activated again while its cooldown remains. The cooldown begins after the skill's activation/resolution, whether the skill succeeds or fails, unless the skill's own approved text explicitly states otherwise.\n\n## 3. Scope and exceptions\n\n- This rule governs SP cost and cooldown only; it does not define a skill's damage, accuracy, range, action cost, effects, or target eligibility.\n- The Soul Ring number determines SP cost; the age of that specific ring determines cooldown.\n- A special skill rule with explicit resource-cost or cooldown wording overrides this general rule for that skill.\n- **Galakrond Dragon Devour exception:** Under Galakrond Rules v2.1 LOCKED, after successful absorption of the first Soul Ring, Dragon Devour is free of activation/use costs. This specific cost-free rule remains in force and is not replaced by the general Soul Ring SP cost table. No cooldown for Dragon Devour is added by this document.\n- This document does not assign or invent the name or effect of any unrecorded Soul Ring skill.\n\n## 4. Player approval and change control\n\nThe player supplied and approved the following values and progression:\n- 1st Soul Ring skill: 5 SP.\n- 2nd Soul Ring skill: 7 SP.\n- SP cost increases by 2 for each subsequent Soul Ring.\n- Cooldown age bands begin at 10–99 years = no cooldown, 100–999 = 1 turn, 1,000–9,999 = 2 turns, continuing by one turn per tenfold age band.\n\nThis is a general game rule. Changes require a new version and explicit player approval."}], "soul_ring": [{"name": "Soul_Ring_and_Absorption_Rules_v1.1_LOCKED", "text": "# Soul Ring & Absorption Rules v1.1\n## Douluo Dalu: Another Fate — Nightmare Edition\n\n**สถานะ:** LOCKED — ผู้เล่นอนุมัติเมื่อ 2026-11-15 (\"LOCKED ทั้งหมด\")  \n**Version:** 1.1  \n**Supersedes:** Soul Ring & Absorption Rules v1.0 LOCKED (เก็บไว้ไม่แก้)  \n**สิ่งที่เปลี่ยนจาก v1.0:** เฉพาะจำนวน Skill ของวงแหวน 100,000 ปีขึ้นไป (SR-04 และข้อความที่อ้างถึง) และเพิ่มข้ออ้างอิงข้อยกเว้นของ Unique System ส่วนอื่นคงเดิมทุกตัวอักษร\n\n## 1. วัตถุประสงค์และลำดับกฎ\nกำหนดแหล่งกำเนิด การประเมินความเข้ากันได้ เงื่อนไขดูดซับ กระบวนการหลอมรวม ความเสี่ยง ความล้มเหลว และการบันทึก Soul Ring ใช้ร่วมกับ Human Soul Rank, Soul Beast Rank, EXP & Level Progression, Combat Formula, Permanent Attribute Acquisition, Character & Entity Classification และกฎเฉพาะ Galakrond/Ddraig ที่ LOCKED แล้ว หากขัดแย้งให้ยึด Core Rules และกฎเฉพาะที่ LOCKED ตามลำดับเดิม\n\n## 2. SR-01 — ประเภทและแหล่งกำเนิด\n- **SR-N Natural:** เกิดจาก Soul Beast หลังตายตามเงื่อนไขโลก\n- **SR-S Self-Condensed:** ควบแน่นจากพลังผู้ใช้/แหล่งพลังที่มีเงื่อนไขรองรับ ต้องมีหลักฐาน ความสามารถ และต้นทุน/เงื่อนไข\n- **SR-D Divine:** เกี่ยวข้องกับ Divine Power ต้องระบุ Divine Authority และเงื่อนไข\n- **SR-Special:** กรณีพิเศษ เช่น ต่างมิติ วิวัฒนาการ หรือมีจิตสำนึก ต้องมีกฎเฉ
